<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mora — time-offset grid for video</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;1,9..144,400&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#E6E9ED; --panel:#F4F5F7; --line:#C9CFD6; --ink:#161B22; --muted:#5A6571;
  --accent:#9A5800; --accent-ink:#FFFFFF; --track:#D2D7DD; --danger:#B3261E; --well:#0E1114;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#13171C; --panel:#191E24; --line:#2A3139; --ink:#DCE1E7; --muted:#828C98;
    --accent:#FFB547; --accent-ink:#1A1206; --track:#242B33; --danger:#FF6B5E; --well:#0B0E11;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#13171C; --panel:#191E24; --line:#2A3139; --ink:#DCE1E7; --muted:#828C98;
  --accent:#FFB547; --accent-ink:#1A1206; --track:#242B33; --danger:#FF6B5E; --well:#0B0E11;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;height:100%;background:var(--bg);color:var(--ink);
  font:12px/1.5 "JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;-webkit-font-smoothing:antialiased}
button,select,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.app{height:100%;display:grid;grid-template-columns:minmax(0,1fr) 348px}
.main{display:flex;flex-direction:column;min-width:0;min-height:0;border-right:1px solid var(--line)}

.top{display:flex;align-items:center;gap:10px;padding:10px 16px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.brand{display:flex;align-items:baseline;gap:12px;min-width:0;margin-right:auto}
.brand h1{font:italic 400 28px/1 Fraunces,Georgia,serif;margin:0;letter-spacing:-.015em}
.brand p{margin:0;color:var(--muted)}

.btn{background:transparent;border:1px solid var(--line);border-radius:6px;padding:6px 11px;cursor:pointer;white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn:disabled{opacity:.45;cursor:default}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.rec{display:inline-flex;align-items:center;gap:8px}
.rec .dot{width:8px;height:8px;border-radius:50%;background:var(--danger)}
.rec[aria-pressed="true"]{background:var(--danger);border-color:var(--danger);color:#fff}
.rec[aria-pressed="true"] .dot{background:#fff}

.stage{flex:1;min-height:0;position:relative;background:var(--well);display:grid;place-items:center;overflow:hidden}
#view{display:block;cursor:crosshair;touch-action:none}
#view.orbit{cursor:grab}
#view.orbit:active{cursor:grabbing}
.stage-note{position:absolute;left:14px;top:10px;color:#8D97A2;font-size:11px;pointer-events:none;max-width:calc(100% - 28px)}
.drop{position:absolute;inset:10px;border:1.5px dashed #FFB547;display:none;place-items:center;color:#FFB547;
  font:italic 400 24px Fraunces,Georgia,serif;background:rgba(11,14,17,.78);pointer-events:none}
.stage.drag .drop{display:grid}
.exporting{position:absolute;inset:0;display:grid;place-items:end center;padding:18px;pointer-events:none}
.exporting[hidden]{display:none}
.exbox{pointer-events:auto;background:#14181D;color:#DCE1E7;border:1px solid #2A3139;border-radius:8px;padding:14px 16px;width:min(360px,90%);display:grid;gap:10px}
.exbox p{margin:0;font-variant-numeric:tabular-nums}
.exbox .btn{justify-self:start;border-color:#3A424C}
.exbar{height:3px;background:#2A3139}
.exbar i{display:block;height:100%;width:0;background:#FFB547}
.fail{color:#E8E4D8;max-width:36ch;text-align:center;font:italic 18px/1.4 Fraunces,Georgia,serif}

.transport{display:flex;align-items:center;gap:10px;padding:10px 16px 4px;flex-wrap:wrap}
.transport input[type=range]{flex:1;min-width:120px}
.time{font-variant-numeric:tabular-nums;color:var(--muted);min-width:15ch}
.scope-wrap{padding:2px 16px 10px}
#scope{width:100%;height:46px;display:block}
.readout{display:flex;gap:6px 18px;color:var(--muted);font-size:11px;flex-wrap:wrap;padding-top:2px}
.readout b{color:var(--ink);font-weight:500}
.warn{color:var(--danger)}

.panel{overflow-y:auto;background:var(--panel);overscroll-behavior:contain}
details.sec{border-bottom:1px solid var(--line)}
details.sec>summary{list-style:none;cursor:pointer;padding:12px 18px 10px;display:flex;justify-content:space-between;align-items:baseline;
  font:italic 400 18px/1.2 Fraunces,Georgia,serif}
details.sec>summary::-webkit-details-marker{display:none}
details.sec>summary::after{content:"+";font:400 13px "JetBrains Mono",monospace;color:var(--muted)}
details.sec[open]>summary::after{content:"−"}
.body{padding:0 18px 16px;display:grid;gap:9px}
.row{display:grid;grid-template-columns:100px minmax(0,1fr);align-items:center;gap:10px}
.row[hidden]{display:none}
.row>.btn,.row>.tog{justify-self:start}
.lbl{color:var(--muted)}
.rng{display:grid;grid-template-columns:minmax(0,1fr) 62px;gap:8px;align-items:center}
.rng output{text-align:right;font-variant-numeric:tabular-nums}
.note{margin:0;color:var(--muted);font-size:11px;line-height:1.55}
.note[hidden]{display:none}
.btns{display:flex;flex-wrap:wrap;gap:6px}
.btns .btn{padding:5px 9px}

input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:20px;background:transparent;margin:0;cursor:pointer}
input[type=range]::-webkit-slider-runnable-track{height:2px;background:var(--line)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:12px;height:12px;border-radius:50%;background:var(--accent);margin-top:-5px;border:0}
input[type=range]::-moz-range-track{height:2px;background:var(--line)}
input[type=range]::-moz-range-thumb{width:12px;height:12px;border-radius:50%;background:var(--accent);border:0}
input[type=range]:disabled{opacity:.4}

select{box-sizing:border-box;width:100%;min-width:0;max-width:100%;background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:5px 8px}
.seg{display:flex;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.seg button{flex:1;background:transparent;border:0;border-right:1px solid var(--line);padding:5px 4px;cursor:pointer;min-width:0}
.seg button:last-child{border-right:0}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--panel)}
.tog{justify-self:start;background:transparent;border:1px solid var(--line);border-radius:20px;padding:3px 12px 3px 24px;cursor:pointer;position:relative}
.tog::before{content:"";position:absolute;left:8px;top:50%;width:8px;height:8px;margin-top:-4px;border-radius:50%;border:1px solid var(--muted)}
.tog[aria-pressed="true"]{border-color:var(--accent)}
.tog[aria-pressed="true"]::before{background:var(--accent);border-color:var(--accent)}
input[type=color]{width:44px;height:26px;padding:0;border:1px solid var(--line);border-radius:6px;background:none;cursor:pointer}
input[type=color]::-webkit-color-swatch-wrapper{padding:2px}
input[type=color]::-webkit-color-swatch{border:0;border-radius:4px}

.chips{display:flex;flex-wrap:wrap;gap:4px}
.chip{min-width:26px;height:22px;padding:0 5px;border:1px solid var(--muted);border-radius:4px;background:transparent;cursor:pointer;font-size:11px;font-variant-numeric:tabular-nums}
.chip[aria-pressed="false"]{border-style:dashed;border-color:var(--line);color:var(--muted);text-decoration:line-through}
.swatches{display:flex;gap:6px;flex-wrap:wrap}
.sw{position:relative;width:28px;height:28px;border-radius:50%;cursor:pointer;box-shadow:inset 0 0 0 1px rgba(0,0,0,.25)}
.sw input{position:absolute;inset:0;opacity:0;width:100%;height:100%;cursor:pointer;border:0}
.sw.on{outline:2px solid var(--ink);outline-offset:2px}
.foot{padding:16px 18px 22px;color:var(--muted);font-size:11px}
.foot em{font:italic 13px Fraunces,Georgia,serif;color:var(--ink)}

.toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--panel);
  padding:8px 14px;border-radius:6px;font-size:12px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:9;max-width:90vw}
.toast.show{opacity:1}

@media (max-width:880px){
  html,body{height:auto}
  .app{grid-template-columns:1fr;height:auto}
  .main{border-right:0}
  .stage{flex:none;height:56vh}
  .panel{overflow:visible;border-top:1px solid var(--line)}
}
@media (prefers-reduced-motion: reduce){ .toast{transition:none} }
</style>
</head>
<body>
<div class="app">
  <div class="main">
    <header class="top">
      <div class="brand"><h1>Mora</h1><p>time-offset grid for video</p></div>
      <button type="button" class="btn" id="loadBtn">Load video</button>
      <button type="button" class="btn" id="snapBtn">Save frame</button>
      <button type="button" class="btn primary" id="expBtn">Export MP4</button>
      <input type="file" id="fileIn" accept="video/*" hidden>
    </header>
    <div class="stage" id="stage">
      <canvas id="view" aria-label="Rendered output"></canvas>
      <div class="stage-note" id="stageNote">Demo clip. Drop a video anywhere here, or use Load video.</div>
      <div class="drop">Drop to load video</div>
      <div class="exporting" id="exOv" hidden>
        <div class="exbox" role="status" aria-live="polite">
          <p id="exTxt">Rendering MP4</p>
          <div class="exbar"><i id="exBar"></i></div>
          <button type="button" class="btn" id="exCancel">Cancel export</button>
        </div>
      </div>
    </div>
    <div class="transport">
      <button type="button" class="btn" id="playBtn">Pause</button>
      <button type="button" class="btn" id="restartBtn">Restart</button>
      <input type="range" id="scrub" min="0" max="1000" step="1" value="0" aria-label="Scrub video" disabled>
      <span class="time" id="timeTxt">demo</span>
      <select id="speedSel" aria-label="Playback speed" style="width:auto">
        <option value="0.25">0.25×</option><option value="0.5">0.5×</option><option value="1" selected>1×</option><option value="1.5">1.5×</option><option value="2">2×</option>
      </select>
    </div>
    <div class="scope-wrap">
      <canvas id="scope" aria-label="Offsets across the frame buffer"></canvas>
      <div class="readout">
        <span>span <b id="roSpan">0.00 s</b></span>
        <span>distinct offsets <b id="roSteps">0</b></span>
        <span>buffered <b id="roBuf">0.0 / 0.0 s</b></span>
        <span>source <b id="roSrc">—</b></span>
        <span class="warn" id="roWarn"></span>
      </div>
    </div>
  </div>
  <aside class="panel" id="panel" aria-label="Controls"></aside>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

}

/* frame-accurate MP4 export: WebCodecs H.264 + mp4-muxer */
const QBPP = { standard: 0.15, high: 0.35, max: 0.6 };

    }
  }
  for (const codec of ['vp09.00.40.08', 'vp09.00.10.08']) {
    const cfg = { codec, width: w, height: h, bitrate, framerate: fps, latencyMode: 'quality' };
    try { const r = await VideoEncoder.isConfigSupported(cfg); if (r.supported) return { cfg, mux: 'vp9' }; } catch (e) {}

}

const exOv = $('#exOv'), exTxt = $('#exTxt'), exBar = $('#exBar');
async function exportMP4() {
  if (exporting || rec) return;

  const pick = await pickEncoder(W, Hh, fps, bitrate);
  if (!pick) { toast('Frame-accurate MP4 needs WebCodecs. Recording in real time instead.'); startRec(dur, bitrate); return; }

  clock = 0; rclock = 0; resetBuf(); K = new Float32Array(0);
  const t0 = performance.now();
  try {
    for (let i = 0; i < total; i++) {

      const needCap = count === 0 || clock - lastCap >= 1 / capFps - 1e-6;
      if (needCap) {

          const t = (((clock - pre * S.speed) % du) + du) % du;

        } else drawDemo(clock);
        capture();
      }

      if (i >= preFrames) {
        const k = i - preFrames;
        const vf = new VideoFrame(canvas, { timestamp: Math.round(k * 1e6 / fps), duration: Math.round(1e6 / fps) });

    } else toast(encErr ? 'Export stopped: ' + (encErr.message || encErr) : 'Export cancelled.');

}
$('#exCancel').addEventListener('click', () => { if (exporting) exporting.cancel = true; });

}

}

}

}

}

function bulk(op) {
