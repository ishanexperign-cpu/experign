<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Conforma — protein motion studio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..600;1,9..144,300..600&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mp4-muxer@5.2.1/build/mp4-muxer.js"></script>
<script src="https://cdn.jsdelivr.net/npm/webm-muxer@5.1.4/build/webm-muxer.js"></script>
<style>
:root{
  --panel:#14171c; --panel2:#1a1e24; --line:#272c34; --line2:#343a44;
  --text:#e6e9ed; --dim:#8a939f; --faint:#5c6470;
  --accent:#7fd8d4; --warm:#f28a2e; --focus:#a8ece8;
  --ui:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --display:'Fraunces',Georgia,'Times New Roman',serif;
  color-scheme:dark;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: light){
  :root:not([data-theme="dark"]){
    --panel:#f2f3f5; --panel2:#e8eaee; --line:#d6d9df; --line2:#c5c9d1;
    --text:#16191d; --dim:#5a6370; --faint:#8b939e; --accent:#1c8a85; --focus:#1c8a85; color-scheme:light;
  }
}
:root[data-theme="light"]{--panel:#f2f3f5;--panel2:#e8eaee;--line:#d6d9df;--line2:#c5c9d1;--text:#16191d;--dim:#5a6370;--faint:#8b939e;--accent:#1c8a85;--focus:#1c8a85;color-scheme:light}
:root[data-theme="dark"]{--panel:#14171c;--panel2:#1a1e24;--line:#272c34;--line2:#343a44;--text:#e6e9ed;--dim:#8a939f;--faint:#5c6470;--accent:#7fd8d4;--focus:#a8ece8;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;height:100%;background:var(--panel);color:var(--text);font:12px/1.45 var(--ui);
  display:grid;grid-template-columns:minmax(0,1fr) 318px;grid-template-rows:minmax(0,1fr) auto;overflow:hidden}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}

/* stage */
#stage{grid-column:1;grid-row:1;position:relative;background:#000;overflow:hidden;min-height:260px;touch-action:none}
#gl{position:absolute;inset:0;width:100%;height:100%;display:block;cursor:grab}
#gl.drag{cursor:grabbing}
#guide{position:absolute;pointer-events:none;border:1px solid rgba(255,255,255,.28);box-shadow:0 0 0 9999px rgba(0,0,0,.28)}
#guide span{position:absolute;right:6px;top:4px;font-size:10px;color:rgba(255,255,255,.55);mix-blend-mode:difference}
.brand{position:absolute;left:18px;top:14px;pointer-events:none;mix-blend-mode:difference;color:#fff}
.brand h1{margin:0;font:italic 300 30px/1 var(--display);font-variation-settings:"opsz" 144;letter-spacing:-.01em}
.brand p{margin:6px 0 0;font-size:11px;opacity:.7}
#hint{position:absolute;left:18px;bottom:12px;font-size:11px;color:#fff;opacity:.55;mix-blend-mode:difference;pointer-events:none;transition:opacity .6s}
#drop{position:absolute;inset:12px;border:1px dashed rgba(255,255,255,.5);display:grid;place-items:center;
  font:italic 300 26px var(--display);color:#fff;background:rgba(0,0,0,.45);pointer-events:none}
#busy{position:absolute;right:14px;top:14px;font-size:11px;color:#fff;background:rgba(0,0,0,.55);padding:5px 9px;border-radius:3px}

/* timeline */
#timeline{grid-column:1;grid-row:2;border-top:1px solid var(--line);background:var(--panel);user-select:none}
.transport{display:flex;align-items:center;gap:10px;padding:8px 12px;border-bottom:1px solid var(--line)}
.transport .grow{flex:1}
.time{font-variant-numeric:tabular-nums;color:var(--dim);min-width:112px}
.time b{color:var(--text);font-weight:500}
.tl-body{display:grid;grid-template-columns:minmax(0,1fr) 262px;min-height:152px}
#tracks{position:relative;padding:0 12px 10px}
.ruler{position:relative;height:22px;margin-left:112px;cursor:ew-resize;border-bottom:1px solid var(--line)}
.ruler i{position:absolute;bottom:0;width:1px;height:5px;background:var(--line2)}
.ruler i.major{height:9px;background:var(--faint)}
.ruler em{position:absolute;bottom:9px;font-style:normal;font-size:10px;color:var(--faint);transform:translateX(-50%)}
.track{display:grid;grid-template-columns:112px minmax(0,1fr);align-items:center;height:28px}
.track .tname{display:flex;align-items:center;gap:7px;color:var(--dim);padding-right:8px;white-space:nowrap}
.track .tname input{margin:0;accent-color:var(--accent)}
.track.sel .tname{color:var(--text)}
.lane{position:relative;height:18px;background:var(--panel2);border-radius:2px;cursor:crosshair}
.clip{position:absolute;top:0;bottom:0;border-radius:2px;cursor:grab;outline-offset:1px}
.clip:focus-visible{outline:2px solid var(--focus)}
.track.off .clip{opacity:.28}
.track.sel .clip{box-shadow:inset 0 0 0 1px rgba(255,255,255,.7)}
.clip .h{position:absolute;top:0;bottom:0;width:8px;cursor:ew-resize}
.clip .h.l{left:-3px}.clip .h.r{right:-3px}
.clip .cap{position:absolute;left:8px;top:1px;font-size:10px;color:rgba(0,0,0,.72);pointer-events:none;white-space:nowrap;overflow:hidden;max-width:calc(100% - 12px)}
#playhead{position:absolute;top:0;bottom:6px;width:1px;background:var(--text);pointer-events:none}
#playhead::before{content:"";position:absolute;top:0;left:-4px;border:4px solid transparent;border-top:6px solid var(--text)}
#inspector{border-left:1px solid var(--line);padding:8px 12px 10px;overflow-y:auto;max-height:190px}
#inspector h3{margin:2px 0 8px;font:italic 400 15px var(--display);color:var(--text)}
#inspector .empty{color:var(--faint);margin-top:6px}

/* panel */
#panel{grid-column:2;grid-row:1 / 3;border-left:1px solid var(--line);overflow-y:auto;overscroll-behavior:contain;background:var(--panel)}
details{border-bottom:1px solid var(--line)}
summary{list-style:none;cursor:pointer;padding:12px 14px 10px;font:400 16px/1.1 var(--display);font-variation-settings:"opsz" 36;display:flex;justify-content:space-between;align-items:baseline}
summary::-webkit-details-marker{display:none}
summary::after{content:"+";font:400 13px var(--ui);color:var(--faint)}
details[open] > summary::after{content:"–"}
.sec{padding:0 14px 14px}
.row{display:grid;grid-template-columns:92px minmax(0,1fr) 40px;align-items:center;gap:8px;min-height:26px}
.row > label{color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row output{text-align:right;color:var(--dim);font-variant-numeric:tabular-nums;font-size:11px}
.row.full{grid-template-columns:92px minmax(0,1fr)}
.sub{margin:10px 0 4px;color:var(--text);font-weight:500;display:flex;align-items:center;justify-content:space-between}
.sub + .row{margin-top:2px}
.grp.dim{opacity:.38}
.ents{display:flex;flex-direction:column;gap:6px}
.ent{border:1px solid var(--line);border-radius:3px;padding:6px 7px;background:var(--panel2)}
.ent-h{display:flex;gap:6px;align-items:center}
.ent-h select{flex:1;min-width:0}
.ent-r{display:flex;flex-wrap:wrap;gap:5px;align-items:center;margin-top:6px}
select{background:var(--panel);border:1px solid var(--line2);border-radius:2px;padding:3px 5px;color:var(--text);font-size:11px}
.num{display:flex;align-items:center;gap:3px;color:var(--dim)}
.num input{width:46px;background:var(--panel);border:1px solid var(--line2);border-radius:2px;padding:2px 4px;color:var(--text);font-size:11px}
.x{background:none;border:1px solid var(--line2);border-radius:2px;width:22px;height:22px;cursor:pointer;color:var(--dim);padding:0}
.x[disabled]{opacity:.3;cursor:default}
.chains{max-height:240px;overflow-y:auto}
.note{color:var(--faint);font-size:11px;margin:6px 0 0}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:18px;background:transparent;margin:0}
input[type=range]::-webkit-slider-runnable-track{height:2px;background:linear-gradient(90deg,var(--accent) var(--p,50%),var(--line2) var(--p,50%))}
input[type=range]::-moz-range-track{height:2px;background:var(--line2)}
input[type=range]::-moz-range-progress{height:2px;background:var(--accent)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:11px;height:11px;border-radius:50%;background:var(--text);margin-top:-4.5px;border:0}
input[type=range]::-moz-range-thumb{width:11px;height:11px;border-radius:50%;background:var(--text);border:0}
input[type=color]{-webkit-appearance:none;appearance:none;width:26px;height:18px;border:1px solid var(--line2);border-radius:2px;padding:0;background:none;cursor:pointer}
input[type=color]::-webkit-color-swatch-wrapper{padding:1px}
input[type=color]::-webkit-color-swatch{border:0;border-radius:1px}
.seg{display:flex;flex-wrap:wrap;gap:3px}
.seg button{background:var(--panel2);border:1px solid var(--line);border-radius:2px;padding:3px 7px;cursor:pointer;color:var(--dim);font-size:11px}
.seg button[aria-pressed="true"]{background:var(--text);color:var(--panel);border-color:var(--text)}
.switch{position:relative;width:28px;height:16px;border-radius:8px;border:1px solid var(--line2);background:var(--panel2);cursor:pointer;padding:0}
.switch::after{content:"";position:absolute;top:2px;left:2px;width:10px;height:10px;border-radius:50%;background:var(--faint);transition:transform .15s}
.switch[aria-checked="true"]{background:var(--accent);border-color:var(--accent)}
.switch[aria-checked="true"]::after{transform:translateX(12px);background:var(--panel)}
.btn{background:var(--panel2);border:1px solid var(--line2);border-radius:3px;padding:5px 10px;cursor:pointer}
.btn:hover{border-color:var(--faint)}
.btn.primary{background:var(--text);color:var(--panel);border-color:var(--text);font-weight:500}
.btn.icon{width:30px;height:28px;padding:0;display:grid;place-items:center}
.btn[disabled]{opacity:.5;cursor:default}
.looks{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.look{border:1px solid var(--line);border-radius:3px;background:var(--panel2);padding:0;cursor:pointer;text-align:left;overflow:hidden}
.look i{display:block;height:34px}
.look span{display:block;padding:4px 6px;font-size:10.5px;color:var(--dim)}
.look[aria-pressed="true"]{border-color:var(--text)}
.look[aria-pressed="true"] span{color:var(--text)}
.chains{margin-top:8px;border-top:1px solid var(--line)}
.chain{display:grid;grid-template-columns:30px minmax(0,1fr) 28px;gap:8px;align-items:center;padding:5px 0;border-bottom:1px solid var(--line)}
.chain .meta{color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chain .meta b{color:var(--text);font-weight:500;margin-right:6px}
.eye{background:none;border:0;cursor:pointer;color:var(--dim);padding:2px}
.eye[aria-pressed="false"]{opacity:.35}
.filebtn{display:flex;gap:6px;margin-top:8px}
#progress{height:3px;background:var(--line2);margin-top:8px;border-radius:2px;overflow:hidden}
#progress i{display:block;height:100%;width:0;background:var(--accent)}
#exportState{color:var(--dim);margin-top:6px;min-height:16px}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--text);color:var(--panel);padding:7px 12px;border-radius:3px;opacity:0;pointer-events:none;transition:opacity .25s;z-index:10;max-width:90vw}
#toast.on{opacity:1}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

@media (max-width:880px){
  body{display:block;overflow:auto;height:auto}
  #stage{height:58vh}
  .tl-body{grid-template-columns:1fr}
  #inspector{border-left:0;border-top:1px solid var(--line);max-height:none}
  #panel{border-left:0;border-top:1px solid var(--line);overflow:visible}
  .ruler{margin-left:84px}.track{grid-template-columns:84px minmax(0,1fr)}
}
@media (prefers-reduced-motion: reduce){ #toast,.switch::after{transition:none} }
</style>
</head>
<body>
<main id="stage" aria-label="3D viewport">
  <canvas id="gl"></canvas>
  <div id="guide" aria-hidden="true"><span id="guideLabel"></span></div>
  <header class="brand"><h1>Conforma</h1><p id="stats">Building structure</p></header>
  <div id="hint">Drag to orbit, scroll to zoom, double-click to reframe. Drop a .pdb file to load it.</div>
  <div id="drop" hidden>Drop to load the structure</div>
  <div id="busy" hidden></div>
</main>

<section id="timeline" aria-label="Timeline">
  <div class="transport">
    <button id="play" class="btn icon" aria-label="Pause">
      <svg width="12" height="12" viewBox="0 0 12 12" aria-hidden="true"><g id="playIcon" fill="currentColor"><rect x="2" y="1" width="3" height="10"/><rect x="7" y="1" width="3" height="10"/></g></svg>
    </button>
    <span class="time" id="time"><b>0.00</b> / 10 s</span>
    <div class="seg" id="durSeg" role="group" aria-label="Loop length"></div>
    <span class="grow"></span>
    <button id="exportQuick" class="btn primary">Export video</button>
  </div>
  <div class="tl-body">
    <div id="tracks">
      <div class="ruler" id="ruler" aria-label="Scrub timeline"></div>
      <div id="trackRows"></div>
      <div id="playhead"></div>
    </div>
    <div id="inspector" aria-live="polite"></div>
  </div>
</section>

<aside id="panel" aria-label="Controls"></aside>
<input type="file" id="fileIn" accept=".pdb,.ent,.txt" class="sr" tabindex="-1">
<div id="toast" role="status" aria-live="polite"></div>
<script>
"use strict";
/* ============ utilities ============ */
const TAU=Math.PI*2, DEG=Math.PI/180, V=THREE.Vector3;
const clamp=(x,a=0,b=1)=>x<a?a:x>b?b:x;
const lerp=(a,b,t)=>a+(b-a)*t;
const sstep=(a,b,x)=>{const t=clamp((x-a)/(b-a));return t*t*(3-2*t)};
const stag=(g,o,k)=>clamp(g*(1+k)-o*k);
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
function rng(seed){let a=seed>>>0;return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const EASE={
  linear:t=>t,
  smooth:t=>t*t*(3-2*t),
  cubic:t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2,
  expo:t=>t<=0?0:t>=1?1:t<.5?Math.pow(2,20*t-10)/2:(2-Math.pow(2,-20*t+10))/2,
  back:t=>{const c1=1.70158,c2=c1*1.525;return t<.5?(Math.pow(2*t,2)*((c2+1)*2*t-c2))/2:(Math.pow(2*t-2,2)*((c2+1)*(t*2-2)+c2)+2)/2}
};
function randUnit(r){const z=r()*2-1,a=r()*TAU,s=Math.sqrt(1-z*z);return new V(s*Math.cos(a),s*Math.sin(a),z)}
function anyPerp(d){const a=Math.abs(d.x)<.9?new V(1,0,0):new V(0,1,0);return a.sub(d.clone().multiplyScalar(a.dot(d))).normalize()}
function centroidV(pts){const c=new V();pts.forEach(p=>c.add(p));return c.multiplyScalar(1/Math.max(1,pts.length))}
function hexRGB(h){const c=new THREE.Color(h);return[c.r,c.g,c.b]}

/* ============ palettes & state ============ */
const PALETTES={
  cryo:{rna:'#e8c547',chains:['#79d3d0','#5b5ce6','#c7a3ef','#4b78ef','#6cc9d3','#8e7ff0'],dna:'#f07a17',neutral:'#898d94'},
  paper:{rna:'#ff6b6b',chains:['#f3e04a','#5fe2ea','#ec72c3','#97df77','#f3a45b','#9aa8ff'],dna:'#ff8a3d',neutral:'#9aa0a6'},
  neon:{rna:'#ffd23f',chains:['#38f2c6','#ff4fa1','#ffd23f','#7b5cff','#33c0ff','#b6ff4a'],dna:'#ff7a1a',neutral:'#7c8594'},
  earth:{rna:'#c9a227',chains:['#d69c63','#8db894','#c8553d','#6a98c3','#b79ad6','#e2be8f'],dna:'#e0773a',neutral:'#a39e98'},
  mono:{rna:'#dcdcdc',chains:['#ececed','#b9bcc2','#8f949c','#d6d7da','#a4a8ae','#c9cbcf'],dna:'#f5f5f5',neutral:'#b0b3b8'},
};
const SS_COL={1:'#ef6a6a',2:'#f2c14e',0:'#9aa3ad'};

const S={
  structure:'complex', seed:7, palette:'cryo', neutral:'#898d94',
  showCartoon:true, cartoonStyle:'cartoon', cartoonColor:'neutral', ribbonW:1, coilR:1,
  showSurface:true, surfShader:'glass', surfColor:'chain', surfOpacity:.42, surfFresnel:.5, surfSmooth:.5, surfDetail:'draft', surfAO:.75,
  showBeads:false, beadR:1.7, showDecor:true,
  outline:false, outlineW:.22, outlineCol:'#0e0f12',
  shader:'studio', light:1.05, gloss:.55, spec:.5, rim:.45, rimCol:'#cfefff', keyAngle:0,
  sky:'#9bb4d0', ground:'#1b1a24', keyCol:'#ffffff', fillCol:'#8fb0ff',
  bgMode:'solid', bg1:'#000000', bg2:'#0a1422', fog:.55,
  particles:false, pCount:900, pSize:1, pOpacity:.5, pColor:'#9fdcff',
  jitter:.25, jitterRate:.4,
  bloom:.12, bloomThresh:.72, bloomRadius:1, vignette:.25, grain:.03, ca:0, exposure:1,
  duration:10, exportLen:'10', res:'1920x1080', fps:30, format:'mp4', quality:'high', guide:true,
  look:'cryo'
};
const LOOKS={
  cryo:{name:'Cryo glass',sw:['#000','#79d3d0','#5b5ce6','#f07a17'],
    set:{palette:'cryo',cartoonColor:'neutral',showCartoon:true,cartoonStyle:'cartoon',showSurface:true,surfShader:'glass',surfColor:'chain',surfOpacity:.42,surfFresnel:.5,showBeads:false,outline:false,
      shader:'studio',light:1.05,gloss:.55,spec:.5,rim:.45,rimCol:'#cfefff',sky:'#9bb4d0',ground:'#1b1a24',keyCol:'#ffffff',fillCol:'#8fb0ff',
      bgMode:'solid',bg1:'#000000',bg2:'#0a1422',fog:.55,particles:false,bloom:.12,bloomThresh:.72,vignette:.25,grain:.03,ca:0,exposure:1}},
  paper:{name:'Paper cartoon',sw:['#fff','#f3e04a','#5fe2ea','#ec72c3'],
    set:{palette:'paper',cartoonColor:'chain',showCartoon:true,cartoonStyle:'cartoon',showSurface:false,showBeads:false,outline:false,
      shader:'toon',light:1.02,gloss:.4,spec:.55,rim:.35,rimCol:'#ffffff',sky:'#ffffff',ground:'#d9dde3',keyCol:'#ffffff',fillCol:'#ffffff',
      bgMode:'solid',bg1:'#ffffff',bg2:'#eef0f3',fog:.35,particles:false,bloom:0,vignette:0,grain:0,ca:0,exposure:1}},
  abyss:{name:'Abyss holo',sw:['#06142a','#38f2c6','#ff4fa1','#33c0ff'],
    set:{palette:'neon',cartoonColor:'chain',showCartoon:true,cartoonStyle:'cartoon',showSurface:true,surfShader:'holo',surfColor:'chain',surfOpacity:.08,surfFresnel:.55,showBeads:false,outline:false,
      shader:'holo',light:1,gloss:.5,spec:.4,rim:.9,rimCol:'#bff6ff',sky:'#1e4060',ground:'#040810',keyCol:'#ffffff',fillCol:'#5aa8ff',
      bgMode:'radial',bg1:'#0a1d3a',bg2:'#000000',fog:.6,particles:true,pColor:'#7fdcff',pOpacity:.55,pCount:1400,bloom:.95,bloomThresh:.22,vignette:.6,grain:.06,ca:.35,exposure:1}},
  iris:{name:'Iridescent',sw:['#1c1430','#e9e9ea','#b9bcc2','#c7a3ef'],
    set:{palette:'mono',cartoonColor:'chain',showCartoon:true,cartoonStyle:'cartoon',showSurface:false,showBeads:false,outline:false,
      shader:'iridescent',light:1.05,gloss:.7,spec:.7,rim:.7,rimCol:'#ffffff',sky:'#b7a8ff',ground:'#150f25',keyCol:'#ffffff',fillCol:'#a0c8ff',
      bgMode:'radial',bg1:'#2a1e46',bg2:'#07060d',fog:.5,particles:true,pColor:'#d8c8ff',pOpacity:.35,pCount:700,bloom:.45,bloomThresh:.55,vignette:.5,grain:.05,ca:.15,exposure:1}},
  clay:{name:'Studio clay',sw:['#dfe2e6','#d69c63','#8db894','#6a98c3'],
    set:{palette:'earth',cartoonColor:'chain',showCartoon:true,cartoonStyle:'cartoon',showSurface:true,surfShader:'frosted',surfColor:'chain',surfOpacity:.55,surfFresnel:.3,showBeads:false,outline:false,
      shader:'clay',light:1.1,gloss:.2,spec:.2,rim:.3,rimCol:'#ffffff',sky:'#ffffff',ground:'#8a8f98',keyCol:'#fff6ee',fillCol:'#dfe8ff',
      bgMode:'linear',bg1:'#e4e7eb',bg2:'#b9bec7',fog:.3,particles:false,bloom:0,vignette:.3,grain:.04,ca:0,exposure:1}},

function chainColor(ch,pal,fb){return ch.type==='protein'?pal.chains[(ch.colorIdx??fb)%pal.chains.length]:(ch.rna?pal.rna:pal.dna)}
function finalize(chains,name,r,align,opts={}){

/* ============ PDB ============ */
const NUC=new Set(['DA','DC','DG','DT','DU','A','C','G','U','T','I','DI']);
function parsePDB(text){

  for(const line of text.split(/\r?\n/)){
    const rec=line.slice(0,6);
    if(rec==='ENDMDL')break;
    if(rec==='HELIX ')helix.push({c:line[19],a:parseInt(line.slice(21,25)),b:parseInt(line.slice(33,37))});
    else if(rec==='SHEET ')sheetR.push({c:line[21],a:parseInt(line.slice(22,26)),b:parseInt(line.slice(33,37))});
    else if(rec==='ATOM  '||(rec==='HETATM'&&line.slice(17,20)==='MSE')){
      const alt=line[16];if(alt&&alt!==' '&&alt!=='A')continue;
      const nm=line.slice(12,16).trim().replace('*',"'"),rn=line.slice(17,20).trim(),ch=(line[21]||'A').trim()||'A',seq=parseInt(line.slice(22,26)),ic=line[26]||' ';
      const x=parseFloat(line.slice(30,38)),y=parseFloat(line.slice(38,46)),z=parseFloat(line.slice(46,54));
      if(!isFinite(x))continue;const k=ch+'|'+seq+'|'+ic;let o=res.get(k);
      if(!o){o={ch,seq,rn,atoms:{}};res.set(k,o);order.push(o)}o.atoms[nm]=new V(x,y,z)}}
  const segs=[];let cur=null;
  order.forEach(o=>{
    let type=null,pt=null,base=null;
    if(o.atoms.CA&&!NUC.has(o.rn)){type='protein';pt=o.atoms.CA}
    else if(o.atoms["C4'"]){type='nucleic';pt=o.atoms["C4'"];const ring=['N1','C2','N3','C4','C5','C6'].map(a=>o.atoms[a]).filter(Boolean);if(ring.length)base=centroidV(ring).sub(pt)}
    if(!type)return;
    const gap=type==='protein'?4.4:8.5;
    if(!cur||cur.ch!==o.ch||cur.type!==type||cur.pts[cur.pts.length-1].distanceTo(pt)>gap){cur={ch:o.ch,type,pts:[],seq:[],base:[]};segs.push(cur)}
    cur.pts.push(pt.clone());cur.seq.push(o.seq);cur.base.push(base)});
  const hasSS=helix.length+sheetR.length>0,chains=[],colorOf={};let ci=0;
  segs.filter(s=>s.pts.length>=3).forEach(s=>{
    const ss=new Uint8Array(s.pts.length);
    if(s.type==='protein'){
      if(hasSS){s.seq.forEach((q,i)=>{if(helix.some(h=>h.c===s.ch&&q>=h.a&&q<=h.b))ss[i]=1;else if(sheetR.some(h=>h.c===s.ch&&q>=h.a&&q<=h.b))ss[i]=2})}
      else guessSS(s.pts,ss)}
    if(colorOf[s.ch]===undefined)colorOf[s.ch]=ci++;
    const nm=s.ch+(chains.some(c=>c.name===s.ch)?"'":'');
    chains.push({name:nm,type:s.type,n:s.pts.length,pts:s.pts,ss,base:s.type==='nucleic'?s.base:null,colorIdx:colorOf[s.ch]})});
  return chains}
function guessSS(P,ss){const n=P.length,d=(i,j)=>P[i].distanceTo(P[j]);
  for(let i=0;i+4<n;i++){const a=d(i,i+3),b=d(i,i+4);if(a>4.2&&a<5.9&&b>5.0&&b<7.2)for(let k=i;k<=i+4;k++)ss[k]=1}
  if(n<6000)for(let i=1;i+2<n;i++){if(ss[i])continue;if(d(i-1,i+1)>6.1&&d(i,i+2)>6.1){
    for(let j=0;j<n;j++){if(Math.abs(j-i)<4)continue;if(d(i,j)<5.4){ss[i]=2;break}}}}
  const clean=(v,min)=>{let s=0;for(let i=0;i<=n;i++){if(i<n&&ss[i]===v)continue;if(i-s<min)for(let k=s;k<i;k++)if(ss[k]===v)ss[k]=0;s=i+1}};
  clean(1,4);clean(2,3)}

/* ============ geometry: tube / rungs / surface ============ */
const SEC_M=10,SEC=(()=>{const t={cx:[],cy:[],cnx:[],cny:[],sx:[],sy:[],snx:[],sny:[]};
  for(let k=0;k<SEC_M;k++){const th=TAU*k/SEC_M,c=Math.cos(th),s=Math.sin(th),sg=Math.sign;
    t.cx.push(c);t.cy.push(s);t.cnx.push(c);t.cny.push(s);
    t.sx.push(sg(c)*Math.pow(Math.abs(c),.5));t.sy.push(sg(s)*Math.pow(Math.abs(s),.5));
    t.snx.push(sg(c)*Math.pow(Math.abs(c),1.5));t.sny.push(sg(s)*Math.pow(Math.abs(s),1.5))}return t})();

  catch(e){console.error(e);setProg(0,'Export stopped: '+(e.message||e))}
  finally{exporting=false;document.getElementById('exportBtn').disabled=false;document.getElementById('exportQuick').disabled=false;document.getElementById('cancelBtn').disabled=true;resize();
    if(exportCancel)setProg(0,'Export cancelled')}}
async function renderVideo(sec){
  let[W,H]=RES[S.res];W&=~1;H&=~1;const fps=S.fps,frames=Math.round(sec*fps);
  let fmt=S.format;const q={std:.12,high:.22,max:.36}[S.quality],bitrate=Math.min(90e6,Math.round(W*H*fps*q));
  const slug=(STRUCT.name||'structure').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');
  if(typeof VideoEncoder==='undefined')return recordRealtime(sec,W,H,fps,slug);
  let cfg=await pickConfig(fmt,W,H,fps,bitrate);
  if(!cfg&&fmt==='mp4'){fmt='webm';cfg=await pickConfig('webm',W,H,fps,bitrate);if(cfg)toast('H.264 is not available in this browser, exporting WebM')}
  if(!cfg)throw new Error('this browser cannot encode video at '+W+'×'+H);
  const Mx=fmt==='mp4'?window.Mp4Muxer:window.WebMMuxer;if(!Mx)throw new Error('video muxer failed to load');
  const muxer=fmt==='mp4'?new Mx.Muxer({target:new Mx.ArrayBufferTarget(),video:{codec:'avc',width:W,height:H,frameRate:fps},fastStart:'in-memory'})
    :new Mx.Muxer({target:new Mx.ArrayBufferTarget(),video:{codec:cfg.codec.startsWith('vp8')?'V_VP8':'V_VP9',width:W,height:H,frameRate:fps}});
  let encErr=null;const enc=new VideoEncoder({output:(ch,meta)=>muxer.addVideoChunk(ch,meta),error:e=>encErr=e});enc.configure(cfg);
  renderer.setPixelRatio(1);renderer.setSize(W,H,false);setRTSize(W,H);
  const dur=Math.round(1e6/fps);loopDur=sec;
  for(let f=0;f<frames;f++){if(exportCancel||encErr)break;
    renderFrame(f/frames,W,H,f);
    const vf=new VideoFrame(canvas,{timestamp:f*dur,duration:dur});enc.encode(vf,{keyFrame:f%(fps*2)===0});vf.close();
    while(enc.encodeQueueSize>4)await sleep(2);
    if(f%2===0){setProg(f/frames,`Rendering ${sec} s loop, frame ${f+1} of ${frames}`);await sleep(0)}}
  if(encErr)throw encErr;
  if(exportCancel){try{enc.close()}catch(e){}return}
  setProg(1,'Encoding');await enc.flush();enc.close();muxer.finalize();
  const blob=new Blob([muxer.target.buffer],{type:fmt==='mp4'?'video/mp4':'video/webm'});
  const name=`conforma-${slug}-${sec}s-${W}x${H}.${fmt}`;setProg(1,`Ready: ${name} (${(blob.size/1048576).toFixed(1)} MB)`);
  resize();await saveFile(name,blob)}
async function recordRealtime(sec,W,H,fps,slug){
  if(!canvas.captureStream||typeof MediaRecorder==='undefined')throw new Error('this browser cannot record video');
  renderer.setPixelRatio(1);renderer.setSize(W,H,false);setRTSize(W,H);
  const stream=canvas.captureStream(fps),rec=new MediaRecorder(stream,{mimeType:MediaRecorder.isTypeSupported('video/webm;codecs=vp9')?'video/webm;codecs=vp9':'video/webm',videoBitsPerSecond:20e6});
  const chunks=[];rec.ondataavailable=e=>e.data.size&&chunks.push(e.data);const done=new Promise(r=>rec.onstop=r);rec.start();
  const t0=performance.now();let f=0;loopDur=sec;
  await new Promise(res=>{const loop=()=>{const el_=(performance.now()-t0)/1000;if(el_>=sec||exportCancel){res();return}
    renderFrame(el_/sec,W,H,f++);setProg(el_/sec,`Recording ${sec} s loop in real time`);requestAnimationFrame(loop)};loop()});
  rec.stop();await done;resize();if(exportCancel)return;
  await saveFile(`conforma-${slug}-${sec}s-${W}x${H}.webm`,new Blob(chunks,{type:'video/webm'}))}

/* ============ init ============ */
drawRuler();syncDur();paintClips();renderInspector();syncUniforms();syncAll();resize();
loadPreset();requestAnimationFrame(tick);
