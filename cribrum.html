<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cribrum — dither, pack, sample, lines, mosaic, track</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..700;1,9..144,300..700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#e8e7e2;--card:#f8f7f4;--line:#d6d4cd;--line2:#e3e1db;--text:#18181a;--dim:#6c6a65;--faint:#9a978f;--acc:#3f55c8;--field:#ffffff;--onacc:#ffffff;--glass:rgba(248,247,244,.84);--hover:rgba(0,0,0,.05);--sel:rgba(0,0,0,.08);
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){--bg:#0b0b0c;--card:#161618;--line:#2b2b30;--line2:#212125;--text:#ebe8e0;--dim:#8f8c85;--faint:#5f5d58;--acc:#a8b6ff;--field:#202024;--onacc:#0c0c12;--glass:rgba(22,22,24,.8);--hover:rgba(255,255,255,.05);--sel:rgba(255,255,255,.09);color-scheme:dark}
}
:root[data-theme="dark"]{--bg:#0b0b0c;--card:#161618;--line:#2b2b30;--line2:#212125;--text:#ebe8e0;--dim:#8f8c85;--faint:#5f5d58;--acc:#a8b6ff;--field:#202024;--onacc:#0c0c12;--glass:rgba(22,22,24,.8);--hover:rgba(255,255,255,.05);--sel:rgba(255,255,255,.09);color-scheme:dark}
*,*::before,*::after{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
body{height:100%;margin:0;background:var(--bg);color:var(--text);font:12px/1.45 "JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;overflow:hidden}
[hidden]{display:none!important}
button,select,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
svg{display:block}
/* stage */
.stage{position:relative;height:100%;display:grid;grid-template-rows:minmax(0,1fr);grid-template-columns:minmax(0,1fr);place-items:center;padding:78px 24px 100px;overflow:hidden;touch-action:none;user-select:none}
#out{display:block;max-width:100%;max-height:100%;width:auto;height:auto;box-shadow:0 30px 80px rgba(0,0,0,.35);cursor:zoom-in;border-radius:2px}
#out.px{image-rendering:pixelated}
.drop{position:fixed;inset:14px;border:1.5px dashed var(--acc);border-radius:18px;display:none;place-items:center;background:color-mix(in srgb,var(--bg) 82%,transparent);font-family:Fraunces,Georgia,serif;font-style:italic;font-size:24px;z-index:40;pointer-events:none}
.stage.dragging .drop{display:grid}
/* top */
.top{position:fixed;left:0;right:0;top:0;display:flex;align-items:center;gap:16px;padding:calc(12px + env(safe-area-inset-top,0px)) 16px 0;pointer-events:none;z-index:5}
.brand{display:grid;gap:3px;pointer-events:none;min-width:0}
.word{font-family:Fraunces,Georgia,"Times New Roman",serif;font-size:26px;font-weight:420;font-style:italic;letter-spacing:-.02em;line-height:1;font-variation-settings:"opsz" 144}
.brow{display:flex;align-items:baseline;gap:10px}
.about{pointer-events:auto;border:0;background:transparent;color:var(--faint);font-size:11px;padding:2px 4px;border-radius:5px;cursor:pointer;opacity:.75}
.about:hover,.about[aria-pressed="true"]{color:var(--text);opacity:1}
.credit{display:grid;gap:10px}
.credit .nm{font:italic 400 22px/1.1 Fraunces,Georgia,serif;color:var(--text)}
.credit .rl{color:var(--dim);margin-top:-4px}
.credit p,.aboutp{margin:0;color:var(--dim);line-height:1.6}
.mini-list{margin:0;padding:0;list-style:none;display:grid;gap:4px;color:var(--faint)}
.readout{display:flex;gap:12px;color:var(--dim);font-size:11px;white-space:nowrap}
.readout b{font-weight:500;color:var(--text)}
.cbar{pointer-events:auto;margin-left:auto;display:flex;align-items:center;gap:8px;padding:5px 6px 5px 12px;background:var(--glass);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border:1px solid var(--line);border-radius:12px;box-shadow:0 10px 30px rgba(0,0,0,.18);max-width:100%;overflow-x:auto;scrollbar-width:none}
.cbar::-webkit-scrollbar{display:none}
.cblab{font:italic 400 14px Fraunces,Georgia,serif;margin-right:2px}
.ratios{display:flex;gap:1px}
.rbtn{display:flex;align-items:center;gap:5px;border:0;background:transparent;color:var(--dim);padding:5px 7px;border-radius:7px;cursor:pointer;white-space:nowrap}
.rbtn svg{width:15px;height:15px}
.rbtn:hover{color:var(--text);background:var(--hover)}
.rbtn[aria-pressed="true"]{color:var(--text);background:var(--sel)}
.csize{width:auto;background:var(--field);border:1px solid var(--line);border-radius:7px;padding:4px 6px}
.cdims{color:var(--faint);white-space:nowrap;font-size:11px}
.swatches{display:flex;gap:5px;padding-left:6px;border-left:1px solid var(--line)}
.sw{position:relative;width:22px;height:22px;border-radius:50%;background:var(--c,#888);box-shadow:inset 0 0 0 1px rgba(127,127,127,.45);cursor:pointer;flex:none}
.sw input{position:absolute;inset:0;opacity:0;width:100%;height:100%;cursor:pointer;border:0;padding:0}
.sw:focus-within{outline:2px solid var(--acc);outline-offset:2px}
.seg.mini button{padding:4px 8px}
/* bottom */
.bottom{position:fixed;left:0;right:0;bottom:0;padding:0 12px calc(12px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;align-items:center;gap:10px;pointer-events:none;z-index:6}
.dock{pointer-events:auto;display:flex;align-items:center;gap:4px;padding:5px;background:var(--glass);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border:1px solid var(--line);border-radius:14px;box-shadow:0 12px 40px rgba(0,0,0,.25);max-width:100%;overflow-x:auto;scrollbar-width:none}
.dock::-webkit-scrollbar{display:none}
.dgrp{display:flex;gap:2px}
.dock button{position:relative;border:0;background:transparent;color:var(--dim);padding:9px 12px;border-radius:9px;cursor:pointer;white-space:nowrap}
.dock button:hover{color:var(--text);background:var(--hover)}
.dock button[aria-pressed="true"]{color:var(--text);background:var(--sel)}
.dock button.dot::after{content:"";position:absolute;top:6px;right:5px;width:5px;height:5px;border-radius:50%;background:var(--acc)}
.iconbtn{display:grid;place-items:center;width:38px;height:36px;padding:0!important}
.iconbtn svg{width:19px;height:19px}
#srcbtn{color:var(--text);background:var(--sel)}
#srcbtn[aria-pressed="true"]{background:var(--text);color:var(--bg)}
#play:disabled{opacity:.3;cursor:default}
.div{width:1px;align-self:stretch;margin:6px 3px;background:var(--line);flex:none}
/* panel */
.panel{pointer-events:auto;align-self:flex-end;width:min(372px,100%);max-height:min(74vh,calc(100dvh - 160px));display:flex;flex-direction:column;background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:0 22px 70px rgba(0,0,0,.32);overflow:hidden}
.panel.left{align-self:flex-start}
.panel.wide{width:min(468px,100%)}
.panel.enter{animation:pin .18s ease-out}
@keyframes pin{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.phead{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;padding:14px 12px 12px 18px;border-bottom:1px solid var(--line2)}
.phead .t{font-family:Fraunces,Georgia,serif;font-style:italic;font-size:21px;line-height:1.1}
.phead .s{color:var(--faint);margin-top:3px}
.phead button{border:0;background:transparent;color:var(--dim);cursor:pointer;width:30px;height:30px;border-radius:8px;display:grid;place-items:center}
.phead button:hover{color:var(--text);background:var(--hover)}
.pbody{overflow-y:auto;overscroll-behavior:contain;padding:2px 0 10px;scrollbar-width:thin}
.grp{border-bottom:1px solid var(--line2)}
.grp:last-child{border-bottom:0}
.grp h3{margin:0;padding:14px 18px 2px;font:italic 400 15px Fraunces,Georgia,serif;color:var(--text)}
details.grp summary{list-style:none;cursor:pointer;padding:14px 18px;font:italic 400 15px Fraunces,Georgia,serif;display:flex;justify-content:space-between;align-items:center}
details.grp summary::-webkit-details-marker{display:none}
details.grp summary::after{content:"";width:7px;height:7px;border-right:1.5px solid var(--dim);border-bottom:1.5px solid var(--dim);transform:rotate(45deg) translateY(-2px);transition:transform .15s}
details.grp[open] summary::after{transform:rotate(-135deg) translateY(-2px)}
details.grp[open] summary{padding-bottom:4px}
.gbody{padding:10px 18px 16px;display:grid;gap:13px}
.sublab{font:italic 400 14px Fraunces,Georgia,serif;margin-top:6px;padding-top:12px;border-top:1px dashed var(--line2)}
.row{display:grid;gap:4px}
.lab{display:flex;justify-content:space-between;gap:8px;color:var(--dim)}
.lab span[title]{cursor:default}
.lab output{color:var(--text);font-variant-numeric:tabular-nums}
select,input[type=text]{width:100%;background:var(--field);border:1px solid var(--line);border-radius:8px;padding:7px 8px}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:18px;background:transparent;margin:0;cursor:pointer;--p:50%}
input[type=range]::-webkit-slider-runnable-track{height:3px;border-radius:3px;background:linear-gradient(90deg,var(--text) var(--p),var(--line) var(--p))}
input[type=range]::-moz-range-track{height:3px;border-radius:3px;background:var(--line)}
input[type=range]::-moz-range-progress{height:3px;border-radius:3px;background:var(--text)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:13px;height:13px;border-radius:50%;background:var(--card);border:2px solid var(--text);margin-top:-5px}
input[type=range]::-moz-range-thumb{width:10px;height:10px;border-radius:50%;background:var(--card);border:2px solid var(--text)}
.hue input[type=range]::-webkit-slider-runnable-track{height:6px;background:linear-gradient(90deg,#f33,#ff3,#3f3,#3ff,#33f,#f3f,#f33)}
.hue input[type=range]::-moz-range-track{height:6px;background:linear-gradient(90deg,#f33,#ff3,#3f3,#3ff,#33f,#f3f,#f33)}
.hue input[type=range]::-moz-range-progress{background:transparent}
.hue input[type=range]::-webkit-slider-thumb{margin-top:-3.5px}
.tg{display:flex;justify-content:space-between;align-items:center;gap:8px;color:var(--dim);cursor:pointer}
.tg input[type=checkbox]{appearance:none;-webkit-appearance:none;width:30px;height:17px;border-radius:99px;background:var(--line);position:relative;cursor:pointer;margin:0;flex:none;transition:background .15s}
.tg input[type=checkbox]::after{content:"";position:absolute;top:2px;left:2px;width:13px;height:13px;border-radius:50%;background:var(--card);box-shadow:0 1px 2px rgba(0,0,0,.3);transition:transform .15s}
.tg input[type=checkbox]:checked{background:var(--acc)}
.tg input[type=checkbox]:checked::after{transform:translateX(13px)}
.tg input[type=color]{width:34px;height:22px;border:1px solid var(--line);border-radius:6px;padding:0;background:none;cursor:pointer}
.tg input[type=color]::-webkit-color-swatch-wrapper{padding:2px}
.tg input[type=color]::-webkit-color-swatch{border:0;border-radius:4px}
.seg{display:flex;background:var(--field);border:1px solid var(--line);border-radius:8px;padding:2px;gap:2px}
.seg button{flex:1;border:0;background:transparent;padding:5px 6px;cursor:pointer;color:var(--dim);border-radius:6px;white-space:nowrap}
.seg button:hover{color:var(--text)}
.seg button[aria-pressed="true"]{background:var(--text);color:var(--bg)}
.btnrow{display:flex;gap:6px;flex-wrap:wrap}
.btn{flex:1;border:1px solid var(--line);background:var(--field);padding:8px 11px;border-radius:8px;cursor:pointer;white-space:nowrap}
.btn:hover{border-color:var(--dim)}
.btn.icon{display:flex;align-items:center;justify-content:center;gap:7px}
.btn.icon svg{width:16px;height:16px}
.btn.primary{background:var(--acc);border-color:var(--acc);color:var(--onacc);padding:10px}
.btn.primary.on{background:#e0533a;border-color:#e0533a;color:#fff}
.note{margin:0;color:var(--faint);overflow-wrap:anywhere}
/* source */
.dropzone{display:grid;justify-items:center;gap:6px;text-align:center;padding:22px 16px;border:1.5px dashed var(--line);border-radius:12px;background:var(--field);cursor:pointer;color:var(--text)}
.dropzone:hover{border-color:var(--acc)}
.dropzone svg{width:28px;height:28px;color:var(--acc)}
.dropzone strong{font:italic 400 17px Fraunces,Georgia,serif}
.dropzone span{color:var(--faint);max-width:30ch}
.seqbtn{justify-content:flex-start}
.seqcount{align-self:center;color:var(--faint);white-space:nowrap;flex:0 0 auto}
.cliplist{display:grid;gap:8px}
.clip{border:1px solid var(--line2);border-radius:11px;background:var(--field);overflow:hidden}
.chead{display:grid;grid-template-columns:auto 56px minmax(0,1fr) auto;gap:9px;align-items:center;padding:7px 6px 7px 8px;cursor:pointer}
.clip.open{border-color:var(--line)}
.tlwrap{display:grid;gap:6px}
.cnum{width:20px;height:20px;border-radius:50%;display:grid;place-items:center;background:var(--text);color:var(--bg);font-size:10px}
.cthumb{width:56px;height:35px;border-radius:6px;display:block}
.cname{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--text)}
.cmeta{color:var(--faint);font-size:11px}
.cact{display:flex;gap:2px}
.cact button{width:26px;height:26px;border:0;border-radius:7px;background:transparent;color:var(--dim);cursor:pointer;display:grid;place-items:center}
.cact button svg{width:16px;height:16px}
.cact button:hover:not(:disabled){background:var(--hover);color:var(--text)}
.cact button:disabled{opacity:.25;cursor:default}
.cbody{display:grid;gap:10px;padding:4px 10px 12px;border-top:1px solid var(--line2);padding-top:10px}
.timeline{width:100%;height:58px;display:block;cursor:ew-resize;touch-action:none;border-radius:8px}
.tlrow{display:flex;align-items:center;justify-content:space-between;gap:10px}
.tlrow .btn{flex:0 0 auto}
.tltime{font-variant-numeric:tabular-nums;color:var(--dim)}
.camrow{display:grid;gap:12px;padding:12px;border:1px solid var(--line2);border-radius:10px}
.scard{border:1px solid var(--line2);border-radius:10px;padding:10px 12px;display:grid;gap:2px}
.scard .sk{color:var(--faint)}
#srcname{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.scard .sm{color:var(--dim)}
/* presets */
.filters{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;margin:0 -18px;padding:0 18px}
.filters::-webkit-scrollbar{display:none}
.fchip{border:1px solid var(--line);background:transparent;color:var(--dim);border-radius:999px;padding:5px 11px;cursor:pointer;white-space:nowrap}
.fchip:hover{color:var(--text)}
.fchip[aria-pressed="true"]{background:var(--text);color:var(--bg);border-color:var(--text)}
.pgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.pcard{border:0;background:transparent;padding:0;cursor:pointer;display:grid;gap:5px;text-align:left;color:var(--dim)}
.pcard canvas{width:100%;aspect-ratio:4/3;height:auto;border-radius:9px;background:var(--field);box-shadow:inset 0 0 0 1px var(--line2);transition:transform .15s,box-shadow .15s}
.pcard.loading canvas{animation:pulse 1.2s ease-in-out infinite}
@keyframes pulse{50%{opacity:.45}}
.pcard span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:11px}
.pcard:hover canvas{transform:translateY(-1px);box-shadow:0 0 0 1px var(--dim)}
.pcard:hover span,.pcard[aria-pressed="true"] span{color:var(--text)}
.pcard[aria-pressed="true"] canvas{box-shadow:0 0 0 2px var(--acc)}
/* effects */
.etiles{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.etile{display:grid;justify-items:center;gap:5px;padding:11px 4px 9px;border:1px solid var(--line);border-radius:10px;background:var(--field);color:var(--dim);cursor:pointer}
.etile svg{width:24px;height:24px}
.etile:hover{color:var(--text);border-color:var(--dim)}
.etile[aria-pressed="true"]{color:var(--bg);background:var(--text);border-color:var(--text)}
/* shapes */
.chips{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.chip{aspect-ratio:1;border:1px solid var(--line);border-radius:9px;background:var(--field);position:relative;display:grid;place-items:center;color:var(--faint);cursor:pointer;padding:0}
.chip:hover{border-color:var(--dim);color:var(--dim)}
.chip svg{width:56%;height:56%;fill:currentColor;overflow:visible}
.chip .glyph{font-weight:600;font-size:14px}
.chip[aria-pressed="true"]{color:var(--text);border-color:var(--text)}
.chip i{position:absolute;top:2px;right:5px;font-style:normal;font-size:10px;color:var(--acc)}
/* export overlay */
.xover{position:fixed;inset:0;display:grid;place-items:center;background:rgba(0,0,0,.45);z-index:50;padding:20px}
.xcard{width:min(460px,100%);background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px;display:grid;gap:12px}
.xcard h4{margin:0;font:italic 400 21px Fraunces,Georgia,serif}
.xcard p{margin:0;color:var(--dim);min-height:2.9em}
.bar{height:4px;background:var(--line);border-radius:4px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--acc);transition:width .15s}
.toast{position:fixed;left:50%;top:calc(76px + env(safe-area-inset-top,0px));transform:translate(-50%,-10px);background:var(--text);color:var(--bg);padding:9px 14px;border-radius:9px;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:60;max-width:90vw}
.toast.show{opacity:1;transform:translate(-50%,0)}
@media (max-width:900px){ .cdims{display:none} .rbtn span{display:none} .rbtn[aria-pressed="true"] span{display:inline} }
@media (max-width:760px), (max-height:520px){
  body{display:grid;grid-template-rows:auto minmax(0,1fr) auto;grid-template-columns:minmax(0,1fr);height:100%}
  .top,.stage,.bottom,.cbar,.dock,.panel{min-width:0}
  .top{position:static;grid-row:1;flex-wrap:wrap;gap:6px 10px;padding:10px 10px 6px}
  .brand{display:flex;align-items:baseline;gap:10px;flex:1 1 auto}
  .word{font-size:22px}
  .readout{font-size:10px;gap:8px;overflow:hidden}
  .readout span:nth-child(n+2){display:none}
  .cbar{margin-left:0;flex:1 1 100%;padding:4px 4px 4px 6px;box-shadow:none}
  .cblab{display:none}
  .stage{grid-row:2;height:auto;min-height:0;padding:6px 10px}
  #out{box-shadow:0 12px 30px rgba(0,0,0,.3)}
  .bottom{position:static;grid-row:3;padding:6px 10px 10px;gap:8px}
  .panel,.panel.wide,.panel.left{align-self:stretch;width:auto;max-height:min(46dvh,440px);box-shadow:0 8px 30px rgba(0,0,0,.22)}
  .dock{align-self:stretch;flex-wrap:nowrap;overflow:hidden;box-shadow:none}
  .dock .div{display:none}
  #tabs{flex:1 1 auto;min-width:0;overflow-x:auto;scrollbar-width:none;mask-image:linear-gradient(90deg,#000 88%,transparent)}
  #tabs::-webkit-scrollbar{display:none}
  .dock button{padding:8px 9px}
  .iconbtn{width:36px;height:34px;flex:none}
  .toast{top:auto;bottom:calc(120px + env(safe-area-inset-bottom,0px))}
  .drop{inset:8px}
}
@media (max-height:520px) and (min-width:761px){
  body{grid-template-columns:minmax(0,1fr) min(360px,45vw);grid-template-rows:auto minmax(0,1fr)}
  .top{grid-column:1/-1}
  .stage{grid-column:1;grid-row:2}
  .bottom{grid-column:2;grid-row:2;flex-direction:column-reverse;justify-content:flex-start;min-height:0;padding-top:0}
  .panel,.panel.wide,.panel.left{max-height:none;flex:1 1 auto;min-height:0}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<main class="stage" id="stage">
  <canvas id="out" aria-label="Rendered output"></canvas>
  <div class="drop">Drop to load</div>
</main>
<header class="top">
  <div class="brand"><div class="brow"><span class="word">Cribrum</span><button type="button" class="about" id="aboutbtn" aria-label="About this tool">About</button></div><div class="readout" id="readout"></div></div>
  <div class="cbar" id="cbar" role="group" aria-label="Canvas"></div>
</header>
<div class="bottom">
  <section class="panel" id="panel" hidden aria-labelledby="ptitle">
    <div class="phead"><div><div class="t" id="ptitle"></div><div class="s" id="psub"></div></div><button type="button" id="pclose" aria-label="Close panel"><svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg></button></div>
    <div class="pbody" id="pbody"></div>
  </section>
  <nav class="dock" aria-label="Controls">
    <button type="button" class="iconbtn" id="srcbtn" aria-label="Source" title="Source: upload, camera or demo"></button>
    <span class="div"></span>

function drawTimeline(){

    c.fillText(`${i + 1}${cl.look ? '  ' + cl.look : ''}`, x0 + 6, top + h - 7.5);
    c.restore();
