<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ZOETROPE — card carousel animator</title>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Archivo:wdth,wght@62..125,400..900&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#101014; --panel:#16161c; --panel2:#1c1c24; --line:#26262f;
    --ink:#e8e8ec; --dim:#8b8b98; --faint:#55555f;
    --acc:#f3aee0; --acc2:#e6f96b;
    --mono:'JetBrains Mono',ui-monospace,monospace;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{background:var(--bg);color:var(--ink);font-family:var(--mono);font-size:12px;overflow:hidden}

  header{height:52px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:16px;padding:0 16px}
  .brand{display:flex;align-items:baseline;gap:10px}
  .brand b{font-family:'Archivo';font-weight:900;font-stretch:120%;font-size:19px;letter-spacing:.14em}
  .brand span{color:var(--faint);font-size:10px;letter-spacing:.08em}
  header .spacer{flex:1}
  .btn{font-family:var(--mono);font-size:11px;letter-spacing:.06em;background:var(--panel2);border:1px solid var(--line);
    color:var(--ink);padding:8px 14px;border-radius:7px;cursor:pointer;transition:.15s}
  .btn:hover{border-color:var(--dim)}
  .btn.pri{background:var(--acc2);border-color:var(--acc2);color:#111;font-weight:700}
  .btn.pri:hover{filter:brightness(1.06)}
  .btn.rec{background:var(--acc);border-color:var(--acc);color:#111;font-weight:700}
  .btn:disabled{opacity:.4;cursor:default}

  main{display:grid;grid-template-columns:288px 1fr 300px;height:calc(100% - 52px)}
  aside{overflow-y:auto;background:var(--panel);border-right:1px solid var(--line);padding:14px;scrollbar-width:thin}
  aside#cardsPanel{border-right:0;border-left:1px solid var(--line)}

  .sec{margin-bottom:22px}
  .sec>h3{font-size:9.5px;letter-spacing:.22em;color:var(--faint);margin-bottom:10px;font-weight:500}
  .row{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:9px}
  .row label{color:var(--dim);font-size:11px;white-space:nowrap}
  .row .val{color:var(--ink);font-size:10.5px;min-width:44px;text-align:right}
  input[type=range]{flex:1;accent-color:var(--acc2);height:2px;cursor:pointer}
  select,input[type=text],input[type=number]{font-family:var(--mono);font-size:11px;background:var(--panel2);color:var(--ink);
    border:1px solid var(--line);border-radius:6px;padding:6px 8px;outline:none;max-width:150px}
  select:focus,input[type=text]:focus,input[type=number]:focus{border-color:var(--dim)}
  input.numin{width:66px;max-width:66px;font-family:var(--mono);font-size:10.5px;background:var(--panel2);color:var(--ink);border:1px solid var(--line);border-radius:6px;padding:5px 6px;outline:none}
  input.numin:focus{border-color:var(--dim)}
  input[type=color]{width:30px;height:24px;border:1px solid var(--line);border-radius:6px;background:none;padding:1px;cursor:pointer}
  .seg{display:flex;background:var(--panel2);border:1px solid var(--line);border-radius:7px;overflow:hidden}
  .seg button{flex:1;font-family:var(--mono);font-size:10.5px;letter-spacing:.05em;background:none;border:0;color:var(--dim);padding:7px 0;cursor:pointer}
  .seg button.on{background:var(--ink);color:#111;font-weight:700}
  .switch{display:flex;align-items:center;gap:8px;cursor:pointer;color:var(--dim);font-size:11px}
  .switch input{accent-color:var(--acc2)}

  /* stage */
  #stage{display:flex;align-items:center;justify-content:center;padding:26px;position:relative;min-width:0;background:
    radial-gradient(ellipse at 50% 40%, #17171d 0%, var(--bg) 70%)}
  #canvasWrap{position:relative;max-width:100%;max-height:100%;box-shadow:0 30px 80px rgba(0,0,0,.55);border-radius:10px;overflow:hidden;border:1px solid #000}
  #canvasWrap canvas{display:block;max-width:100%;max-height:calc(100vh - 110px);width:auto;height:auto}
  #recBadge{position:absolute;top:14px;left:14px;background:rgba(0,0,0,.72);border:1px solid var(--acc);color:var(--acc);
    padding:7px 12px;border-radius:7px;font-size:10.5px;letter-spacing:.1em;display:none;align-items:center;gap:8px}
  #recBadge i{width:8px;height:8px;border-radius:50%;background:var(--acc);animation:bl 1s infinite}
  @keyframes bl{50%{opacity:.2}}
  #hint{position:absolute;bottom:10px;left:0;right:0;text-align:center;color:var(--faint);font-size:9.5px;letter-spacing:.08em}

  /* cards panel */
  .card-item{background:var(--panel2);border:1px solid var(--line);border-radius:9px;padding:10px;margin-bottom:10px}
  .card-item .head{display:flex;align-items:center;gap:8px;margin-bottom:8px}
  .card-item .idx{font-size:10px;color:var(--faint);letter-spacing:.1em}
  .card-item select.type{flex:1;max-width:none}
  .icon-btn{background:none;border:1px solid var(--line);border-radius:5px;color:var(--dim);width:22px;height:22px;cursor:pointer;font-size:11px;line-height:1}
  .icon-btn:hover{color:var(--ink);border-color:var(--dim)}
  .card-item textarea{width:100%;font-family:var(--mono);font-size:11px;background:var(--panel);border:1px solid var(--line);
    border-radius:6px;color:var(--ink);padding:6px 8px;resize:vertical;min-height:34px;outline:none}
  .card-item .mini{display:flex;gap:8px;align-items:center;margin-top:7px}
  .card-item .mini label{color:var(--faint);font-size:10px}
  .filebtn{display:inline-block;font-size:10.5px;border:1px dashed var(--line);border-radius:6px;color:var(--dim);
    padding:6px 9px;cursor:pointer;margin-top:7px}
  .filebtn:hover{color:var(--ink);border-color:var(--dim)}
  .fname{font-size:9.5px;color:var(--acc2);margin-top:5px;word-break:break-all}
  .urlrow{display:flex;gap:6px;margin-top:7px}
  .urlrow input{flex:1;max-width:none}
  #addCard{width:100%;border-style:dashed}

  @media (max-width:960px){
    body{overflow:auto}
    main{grid-template-columns:1fr;height:auto}
    aside{border:0;border-bottom:1px solid var(--line)}
    #stage{order:-1;min-height:60vh}
  }
</style>
</head>
<body>

<header>
  <div class="brand"><b>ZOETROPE</b><span>3D CARD CAROUSEL ANIMATOR · EXPERIGN</span></div>
  <div class="spacer"></div>
  <button class="btn" id="btnHtml">Export HTML</button>
  <button class="btn rec" id="btnRec">● Record loop (WebM)</button>
</header>

<main>
  <aside id="controlsPanel">
    <div class="sec">
      <h3>GEOMETRY</h3>
      <div class="row"><label>Axis</label>
        <div class="seg" id="axisSeg" style="width:130px">
          <button data-v="y" class="on">HORIZ</button><button data-v="x">VERT</button>
        </div>
      </div>
      <div class="row"><label>Card width</label><input type="range" id="cardW" min="240" max="1200" step="10" value="620"><input type="number" class="numin" id="cardWn" min="100" max="4000" value="620"></div>
      <div class="row"><label>Card height</label><input type="range" id="cardH" min="240" max="1400" step="10" value="780"><input type="number" class="numin" id="cardHn" min="100" max="4000" value="780"></div>
      <div class="row"><label>Spacing</label><input type="range" id="gap" min="0" max="600" step="5" value="150"><span class="val" id="gapv"></span></div>
      <div class="row"><label>Corner radius</label><input type="range" id="rad" min="0" max="120" step="2" value="34"><span class="val" id="radv"></span></div>
    </div>

    <div class="sec">
      <h3>CAMERA</h3>
      <div class="row"><label>Focal length</label><input type="range" id="focal" min="16" max="200" step="1" value="50"><span class="val" id="focalv"></span></div>
      <div class="row"><label>Perspective</label><input type="range" id="persp" min="0.35" max="3" step="0.05" value="1"><span class="val" id="perspv"></span></div>
      <div class="row"><label>Zoom</label><input type="range" id="zoom" min="0.5" max="2.5" step="0.05" value="1"><span class="val" id="zoomv"></span></div>
      <div class="row"><button class="btn" id="resetCam" style="width:100%">↺ Reset camera</button></div>
    </div>

    <div class="sec">
      <h3>3D VIEW</h3>
      <div class="row"><label>Tilt (X)</label><input type="range" id="tiltX" min="-80" max="80" step="1" value="0"><span class="val" id="tiltXv"></span></div>
      <div class="row"><label>Yaw (Y)</label><input type="range" id="yawY" min="-80" max="80" step="1" value="0"><span class="val" id="yawYv"></span></div>
      <div class="row"><label>Roll (Z)</label><input type="range" id="rollZ" min="-180" max="180" step="1" value="0"><span class="val" id="rollZv"></span></div>
      <div class="row"><button class="btn" id="resetView" style="width:100%">↺ Reset view</button></div>
    </div>

    <div class="sec">
      <h3>MOTION</h3>
      <div class="row"><label>Mode</label>
        <div class="seg" id="modeSeg" style="width:150px">
          <button data-v="continuous" class="on">SPIN</button><button data-v="stepped">STEP</button>
        </div>
      </div>
      <div class="row" id="rowRev"><label>Sec / rev</label><input type="range" id="revSec" min="2" max="40" step="0.5" value="14"><span class="val" id="revSecv"></span></div>
      <div class="row" id="rowStep" style="display:none"><label>Sec / step</label><input type="range" id="stepSec" min="0.4" max="5" step="0.1" value="1.6"><span class="val" id="stepSecv"></span></div>
      <div class="row" id="rowEase" style="display:none"><label>Curve</label>
        <select id="easing">
          <option value="cubic">Smooth (cubic)</option>
          <option value="quint">Snappy (quint)</option>
          <option value="back">Overshoot</option>
          <option value="elastic">Elastic</option>
          <option value="expo">Expo out</option>
          <option value="linear">Linear</option>
        </select>
      </div>
      <div class="row" id="rowHold" style="display:none"><label>Hold</label><input type="range" id="hold" min="0" max="80" step="1" value="35"><span class="val" id="holdv"></span></div>
      <div class="row"><label>Direction</label>
        <div class="seg" id="dirSeg" style="width:110px">
          <button data-v="1" class="on">→</button><button data-v="-1">←</button>
        </div>
      </div>
    </div>

    <div class="sec">
      <h3>LOOK</h3>
      <div class="row"><label>Background</label><input type="color" id="bg" value="#3a3a42"></div>
      <div class="row"><label class="switch"><input type="checkbox" id="fadeOn" checked> Edge fade</label></div>
      <div class="row" id="rowFade"><label>Fade width</label><input type="range" id="fadeW" min="5" max="45" step="1" value="24"><span class="val" id="fadeWv"></span></div>
      <div class="row"><label class="switch"><input type="checkbox" id="frameOn" checked> Social frame</label></div>
      <div class="row" id="rowHandle"><label>Handle</label><input type="text" id="handle" value="mews" maxlength="24"></div>
      <div class="row" id="rowAv"><label>Avatar color</label><input type="color" id="avColor" value="#f3aee0"></div>
    </div>

    <div class="sec">
      <h3>WIGGLE</h3>
      <div class="row"><label>Mode</label>
        <div class="seg" id="wiggleSeg" style="width:180px">
          <button data-v="off" class="on">OFF</button><button data-v="constant">CONST</button><button data-v="hover">HOVER</button>
        </div>
      </div>
      <div class="row" id="rowWigStyle"><label>Style</label>
        <select id="wiggleAxis">
          <option value="tiltXY" selected>Tilt (3D wobble)</option>
          <option value="rockZ">Rock (in-plane)</option>
          <option value="bobY">Bob (vertical)</option>
          <option value="swayX">Sway (horizontal)</option>
          <option value="pulse">Pulse (scale)</option>
        </select>
      </div>
      <div class="row" id="rowWigAmp"><label>Amount</label><input type="range" id="wiggleAmp" min="0" max="1.6" step="0.02" value="0.5"><span class="val" id="wiggleAmpv"></span></div>
      <div class="row" id="rowWigFreq"><label>Speed</label><input type="range" id="wiggleFreq" min="0.1" max="4" step="0.1" value="1"><span class="val" id="wiggleFreqv"></span></div>
    </div>

    <div class="sec">
      <h3>VFX</h3>
      <div class="row"><label>Baseline</label><input type="range" id="vfxFloor" min="0" max="1" step="0.02" value="0"><span class="val" id="vfxFloorv"></span></div>
      <div class="row"><label>Velocity gain</label><input type="range" id="vfxGain" min="0" max="2.5" step="0.05" value="1"><span class="val" id="vfxGainv"></span></div>
      <div class="row" style="margin-top:12px"><label style="color:var(--acc2)">RIPPLE</label></div>
      <div class="row"><label>Amount</label><input type="range" id="vfxLiquid" min="0" max="1.6" step="0.02" value="0"><span class="val" id="vfxLiquidv"></span></div>
      <div class="row"><label>Frequency</label><input type="range" id="ripFreq" min="0.3" max="3" step="0.05" value="1"><span class="val" id="ripFreqv"></span></div>
      <div class="row"><label>Speed</label><input type="range" id="ripSpeed" min="0.3" max="7" step="0.1" value="2.4"><span class="val" id="ripSpeedv"></span></div>
      <div class="row" style="margin-top:12px"><label style="color:var(--acc2)">MOTION BEND</label></div>
      <div class="row"><label>Amount</label><input type="range" id="vfxDisp" min="0" max="1.6" step="0.02" value="0"><span class="val" id="vfxDispv"></span></div>
      <div class="row"><label>Curl</label><input type="range" id="bendCurl" min="0" max="2.5" step="0.05" value="1"><span class="val" id="bendCurlv"></span></div>
      <div class="row" style="margin-top:12px"><label style="color:var(--acc2)">TWIST · JELLY</label></div>
      <div class="row"><label>Twist</label><input type="range" id="vfxTwist" min="0" max="1.6" step="0.02" value="0"><span class="val" id="vfxTwistv"></span></div>
      <div class="row"><label>Jelly</label><input type="range" id="vfxJelly" min="0" max="1.6" step="0.02" value="0"><span class="val" id="vfxJellyv"></span></div>
      <div class="row" style="margin-top:12px"><label style="color:var(--acc2)">GLITCH SLICE</label></div>
      <div class="row"><label>Amount</label><input type="range" id="vfxGlitch" min="0" max="1.6" step="0.02" value="0"><span class="val" id="vfxGlitchv"></span></div>
      <div class="row"><label>Bands</label><input type="range" id="gliBands" min="3" max="30" step="1" value="10"><span class="val" id="gliBandsv"></span></div>
      <div class="row"><label>Rate</label><input type="range" id="gliRate" min="3" max="40" step="1" value="16"><span class="val" id="gliRatev"></span></div>
      <div class="row" style="margin-top:12px"><label>Presets</label>
        <div class="seg" id="vfxPreset" style="width:200px">
          <button data-v="clean">CLEAN</button><button data-v="liquid">LIQUID</button><button data-v="cyber">CYBER</button><button data-v="jelly">JELLY</button><button data-v="max">MAX</button>
        </div>
      </div>
      </div>
    </div>

    <div class="sec">
      <h3>OUTPUT</h3>
      <div class="row"><label>Resolution</label>
        <select id="resSel">
          <option value="1920x1080" selected>1920 × 1080</option>
          <option value="1080x1080">1080 × 1080</option>
          <option value="1080x1350">1080 × 1350</option>
          <option value="1080x1920">1080 × 1920</option>
          <option value="1280x720">1280 × 720</option>
          <option value="custom">Custom…</option>
        </select>
      </div>
      <div class="row" id="rowResCustom" style="display:none"><label>W × H</label>
        <input type="number" class="numin" id="resWn" min="240" max="4096" value="1920">
        <input type="number" class="numin" id="resHn" min="240" max="4096" value="1080">
      </div>
      <div class="row"><label>Loop length</label><span class="val" id="loopLen"></span></div>
    </div>
  </aside>

  <section id="stage">
    <div id="canvasWrap"></div>
    <div id="recBadge"><i></i><span id="recTxt">RECORDING</span></div>
    <div id="hint">preview and exports render from the same engine — what you see is what you ship</div>
  </section>

  <aside id="cardsPanel">
    <div class="sec">
      <h3>CARDS</h3>
      <div id="cardList"></div>
      <button class="btn" id="addCard">+ Add card</button>
    </div>
  </aside>
</main>

<div id="errBox" style="display:none;position:fixed;left:12px;right:12px;bottom:12px;z-index:9999;
  background:#2a1013;border:1px solid #ff4b3e;color:#ffb4ae;border-radius:10px;padding:12px 40px 12px 14px;
  font:11px/1.5 'JetBrains Mono',monospace;white-space:pre-wrap;max-height:180px;overflow:auto"></div>
<script>
(function(){
  var box=null;
  window.__reportErr=function(msg){
    box=box||document.getElementById('errBox');
    if(!box)return;
    box.style.display='block';
    box.textContent+=(box.textContent?'\n\n':'')+msg;
  };
  window.addEventListener('error',function(e){
    window.__reportErr('ERROR: '+(e.message||e.type)+(e.filename?'\n'+e.filename.split('/').pop()+':'+e.lineno:''));
  });
  window.addEventListener('unhandledrejection',function(e){
    window.__reportErr('PROMISE ERROR: '+(e.reason&&e.reason.message||e.reason));
  });
  // three.js CDN failure is the most common "nothing renders" cause
  window.addEventListener('load',function(){
    if(typeof THREE==='undefined') window.__reportErr('three.js failed to load from CDN — check network access to cdnjs.cloudflare.com');
  });
})();
</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
/* ============================================================
   ENGINE — fully self-contained. Serialized verbatim into the
   HTML export, so preview and export share one source of truth.
   ============================================================ */
function engineMain(CONFIG, mount, opts){
  opts = opts || {};
  var PX = 1/300; // px -> world
  var renderer = new THREE.WebGLRenderer({antialias:true, preserveDrawingBuffer:true});
  renderer.setPixelRatio(1);
  mount.appendChild(renderer.domElement);

  var scene = new THREE.Scene();
  var camera = new THREE.PerspectiveCamera(45, 16/9, 0.01, 100);
  var rig = new THREE.Group();
  var group = new THREE.Group();
  rig.add(group);
  scene.add(rig);
  function applyRig(){
    rig.rotation.set(
      (CONFIG.tiltX||0)*Math.PI/180,
      (CONFIG.yawY||0)*Math.PI/180,
      (CONFIG.rollZ||0)*Math.PI/180
    );
  }

  // overlay (edge fade) — orthographic pass, baked into every frame
  var ovScene = new THREE.Scene();
  var ovCam = new THREE.OrthographicCamera(-1,1,1,-1,0,1);
  var fadeMatA, fadeMatB, fadeMeshA, fadeMeshB;
  (function(){
    var vs = 'varying vec2 vUv;void main(){vUv=uv;gl_Position=vec4((modelMatrix*vec4(position,1.0)).xy,0.0,1.0);}';
    var fs = 'varying vec2 vUv;uniform vec3 uC;uniform float uFlip;void main(){float a=uFlip>0.5?vUv.x:1.0-vUv.x;gl_FragColor=vec4(uC,a);}';
    function mk(flip){return new THREE.ShaderMaterial({vertexShader:vs,fragmentShader:fs,transparent:true,depthTest:false,
      uniforms:{uC:{value:new THREE.Color(CONFIG.bg)},uFlip:{value:flip}}});}
    fadeMatA = mk(0); fadeMatB = mk(1);
    fadeMeshA = new THREE.Mesh(new THREE.PlaneGeometry(2,2), fadeMatA);
    fadeMeshB = new THREE.Mesh(new THREE.PlaneGeometry(2,2), fadeMatB);
    ovScene.add(fadeMeshA); ovScene.add(fadeMeshB);
  })();

  // Plain passthrough vertex shader — guaranteed baseline fallback.
  var cardVS_PLAIN = 'varying vec2 vUv;void main(){vUv=uv;gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0);}';

  // CARD-LEVEL VFX live in the VERTEX shader: the card plane itself ripples,
  // bends, and slices as an object while the artwork on it stays intact.
  // All effects scale with uMotion (normalized rotation speed) so they act as
  // velocity-driven transitions: still card = clean, spinning card = distorted.
  var cardVS_FX = [
    'varying vec2 vUv;',
    'uniform vec2 uSize;',
    'uniform float uTime;uniform float uMotion;uniform float uVel;uniform float uSeed;',
    'uniform float uLiquid;uniform float uDisp;uniform float uGlitch;uniform float uTwist;uniform float uJelly;',
    'uniform float uRipFreq;uniform float uRipSpeed;uniform float uBendCurl;',
    'uniform float uGliBands;uniform float uGliRate;uniform float uFloor;uniform float uGain;',
    'float hash(float n){return fract(sin(n)*43758.5453);}',
    'void main(){',
    ' vUv=uv;',
    ' vec3 p=position;',
    ' vec2 np=p.xy/max(uSize.x,0.0001);',
    ' float amt=clamp(uFloor+uMotion*uGain,0.0,1.5);',
    // cloth ripple — freq + speed granular
    ' if(uLiquid>0.001&&amt>0.001){',
    '   float t=uTime*uRipSpeed+uSeed;',
    '   float rip=sin(np.x*9.0*uRipFreq+t)+sin(np.y*6.5*uRipFreq-t*1.35)*0.8;',
    '   p.z+=rip*uLiquid*amt*uSize.x*0.055;',
    '   p.x+=sin(np.y*4.5*uRipFreq+t*0.7)*uLiquid*amt*uSize.x*0.02;',
    ' }',
    // motion bend — curl amount granular, direction-aware via signed velocity
    ' if(uDisp>0.001&&amt>0.001){',
    '   float v=uVel;',
    '   p.z+=-v*np.x*abs(np.x)*uDisp*uSize.x*0.55*uBendCurl;',
    '   p.x*=1.0+uDisp*amt*0.18;',
    '   p.z+=-v*np.y*np.y*uDisp*uSize.x*0.12*uBendCurl;',
    ' }',
    // twist — card corkscrews around its vertical axis with velocity
    ' if(uTwist>0.001&&amt>0.001){',
    '   float a=uVel*uTwist*np.y*1.4;',
    '   float cs=cos(a);float sn=sin(a);',

  // ---------- texture builders ----------
  function textTexture(card, w, h){

    var x = cv.getContext('2d');

    var lines = String(card.text||'').split('\n').filter(function(l){return l.length});

      x.textAlign='center'; x.textBaseline='middle';

        if(lines.length*fs*1.18 > ch-pad*2){ fit=false; fs*=0.94; }

  function frameTexture(w, h, rad, handle, avColor){

  // ---------- build ----------

  var ringRadius_=1, halfSpan_=1;

    var mNorm=Math.min(Math.abs(velRaw)/3.0,1.0);
    motionSm+=(mNorm-motionSm)*Math.min(dt*6,1);
    velSm+=(Math.max(-1,Math.min(velRaw/3.0,1))-velSm)*Math.min(dt*6,1);
    for(var vi=0;vi<vfxMats.length;vi++){
      var u=vfxMats[vi].uniforms;
      u.uTime.value=t; u.uMotion.value=motionSm; u.uVel.value=velSm;
      u.uLiquid.value=CONFIG.vfxLiquid||0;
      u.uDisp.value=CONFIG.vfxDisp||0;
      u.uGlitch.value=CONFIG.vfxGlitch||0;
      u.uTwist.value=CONFIG.vfxTwist||0;
      u.uJelly.value=CONFIG.vfxJelly||0;
      u.uRipFreq.value=CONFIG.ripFreq||1;
      u.uRipSpeed.value=CONFIG.ripSpeed||2.4;
      u.uBendCurl.value=CONFIG.bendCurl||1;
      u.uGliBands.value=CONFIG.gliBands||10;
      u.uGliRate.value=CONFIG.gliRate||16;
      u.uFloor.value=CONFIG.vfxFloor||0;
      u.uGain.value=(CONFIG.vfxGain==null?1:CONFIG.vfxGain);
    }
    updateHover();
    applyWiggle(dt);
    renderer.autoClear=true;
    renderer.render(scene,camera);
    renderer.autoClear=false;
    renderer.render(ovScene,ovCam);
    renderer.autoClear=true;
    requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);

  build();

  return {
    canvas:renderer.domElement,
    rebuild:build,
    look:applyLook,
    view:applyRig,
    cam:applyCam,
    resize:resize,
    loopSeconds:loopSeconds,
    resetTime:function(){ t=0; last=performance.now(); },
    dispose:function(){ running=false; clearGroup(); renderer.dispose(); }
  };
}

function bindRange(id, key, unit, kind){

function bindSeg(id, key, kind, parse){
  var seg=document.getElementById(id);

function linkNum(sliderId,numId,key){
  var sl=document.getElementById(sliderId),num=document.getElementById(numId);
  if(!sl||!num)return;
  sl.addEventListener('input',function(){ num.value=sl.value; });
  num.addEventListener('change',function(){
    var v=parseFloat(num.value); if(isNaN(v))return;
    v=Math.max(parseFloat(num.min),Math.min(parseFloat(num.max),v));
    num.value=v; cfg[key]=v;
    if(v>=parseFloat(sl.min)&&v<=parseFloat(sl.max)) sl.value=v;
    engine.rebuild();
  });
}

var listEl=document.getElementById('cardList');
function renderCards(){
  listEl.innerHTML='';
  cfg.cards.forEach(function(card,i){
    var d=document.createElement('div'); d.className='card-item';
    var head=document.createElement('div'); head.className='head';
    head.innerHTML='<span class="idx">'+String(i+1).padStart(2,'0')+'</span>';
    var sel=document.createElement('select'); sel.className='type';
    ['text','image','gif','video'].forEach(function(t){
      var o=document.createElement('option'); o.value=t;
      o.textContent={text:'Text card',image:'Image',gif:'GIF',video:'Video'}[t];
      if(card.type===t)o.selected=true; sel.appendChild(o);
    });
    sel.addEventListener('change',function(){ card.type=sel.value; renderCards(); engine.rebuild(); });
    head.appendChild(sel);
    [['▲',-1],['▼',1]].forEach(function(m){
      var b=document.createElement('button'); b.className='icon-btn'; b.textContent=m[0];
      b.addEventListener('click',function(){
        var j=i+m[1]; if(j<0||j>=cfg.cards.length)return;
        cfg.cards.splice(j,0,cfg.cards.splice(i,1)[0]); renderCards(); engine.rebuild(); updateLoopLen();
      }); head.appendChild(b);
    });
    var del=document.createElement('button'); del.className='icon-btn'; del.textContent='×';
    del.addEventListener('click',function(){ cfg.cards.splice(i,1); renderCards(); engine.rebuild(); updateLoopLen(); });
    head.appendChild(del);
    d.appendChild(head);

    if(card.type==='text'){
      var ta=document.createElement('textarea'); ta.value=card.text||''; ta.placeholder='Card text — new line = new row';
      ta.addEventListener('change',function(){ card.text=ta.value; engine.rebuild(); });
      d.appendChild(ta);
      var mini=document.createElement('div'); mini.className='mini';
      mini.innerHTML='<label>bg</label>'; 
      var c1=document.createElement('input'); c1.type='color'; c1.value=card.color||'#f3aee0';
      c1.addEventListener('input',function(){ card.color=c1.value; engine.rebuild(); });
      mini.appendChild(c1);
      var l2=document.createElement('label'); l2.textContent='text'; mini.appendChild(l2);
      var c2=document.createElement('input'); c2.type='color'; c2.value=card.textColor||'#111111';
      c2.addEventListener('input',function(){ card.textColor=c2.value; engine.rebuild(); });
      mini.appendChild(c2);
      d.appendChild(mini);
    } else {
      var accept={image:'image/*',gif:'image/gif',video:'video/*'}[card.type];
      var lab=document.createElement('label'); lab.className='filebtn'; lab.textContent='Upload file';
      var fi=document.createElement('input'); fi.type='file'; fi.accept=accept; fi.style.display='none';
      fi.addEventListener('change',function(){
        var f=fi.files[0]; if(!f)return;
        var r=new FileReader();
        r.onload=function(){ card.src=r.result; card.name=f.name; renderCards(); engine.rebuild(); };
        r.readAsDataURL(f);
      });
      lab.appendChild(fi); d.appendChild(lab);
      var ur=document.createElement('div'); ur.className='urlrow';
      var ui=document.createElement('input'); ui.type='text'; ui.placeholder='…or paste URL';
      if(card.src && card.src.slice(0,5)!=='data:') ui.value=card.src;
      var ub=document.createElement('button'); ub.className='icon-btn'; ub.textContent='↵'; ub.style.width='28px';
      ub.addEventListener('click',function(){ if(ui.value){ card.src=ui.value; card.name=''; renderCards(); engine.rebuild(); } });
      ur.appendChild(ui); ur.appendChild(ub); d.appendChild(ur);
      if(card.name){ var fn=document.createElement('div'); fn.className='fname'; fn.textContent='◆ '+card.name; d.appendChild(fn); }
    }
    listEl.appendChild(d);
  });
}

/* ---------- export: looped WebM ---------- */
var recording=false;
document.getElementById('btnRec').addEventListener('click',function(){
  if(recording) return;
  recording=true;
  var btn=this; btn.disabled=true;
  var badge=document.getElementById('recBadge'), txt=document.getElementById('recTxt');
  badge.style.display='flex';
  var dur=engine.loopSeconds();
  var stream=engine.canvas.captureStream(60);
  var mime=['video/webm;codecs=vp9','video/webm;codecs=vp8','video/webm'].find(function(m){return MediaRecorder.isTypeSupported(m);});
  var rec=new MediaRecorder(stream,{mimeType:mime,videoBitsPerSecond:14e6});
  var chunks=[];
  rec.ondataavailable=function(e){ if(e.data.size) chunks.push(e.data); };
  rec.onstop=function(){
    var b=new Blob(chunks,{type:'video/webm'});
    var a=document.createElement('a'); a.href=URL.createObjectURL(b); a.download='carousel-loop.webm'; a.click();
    setTimeout(function(){URL.revokeObjectURL(a.href);},4000);
    badge.style.display='none'; btn.disabled=false; recording=false;
  };
  engine.resetTime();
  rec.start();
  var t0=performance.now();
  (function upd(){
    var el=(performance.now()-t0)/1000;
    txt.textContent='RECORDING '+Math.min(el,dur).toFixed(1)+' / '+dur.toFixed(1)+'s';
    if(el<dur){ requestAnimationFrame(upd); } else { rec.stop(); }
  })();
});
