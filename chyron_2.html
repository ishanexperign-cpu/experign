<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CHYRON — text overlay animator</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,600;1,9..144,300&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#191c22; --panel:#20242b; --panel2:#262b33; --line:#31363f; --line2:#3d434d;
  --ink:#e2e5ea; --dim:#8d939d; --faint:#5c626c; --mark:#f2d94e; --mark-ink:#241f05;
  --danger:#e26d5c; --mono:'JetBrains Mono',ui-monospace,Menlo,monospace; --serif:'Fraunces',Georgia,serif;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:var(--bg);color:var(--ink);font:12px/1.45 var(--mono);overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:var(--panel2);border:1px solid var(--line2);border-radius:4px;padding:5px 9px}
button:hover{border-color:#5a6170}
button.primary{background:var(--mark);color:var(--mark-ink);border-color:var(--mark);font-weight:600}
button.primary:hover{background:#ffe95e}
button:disabled{opacity:.45;cursor:default}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--mark);outline-offset:1px}
input[type=text],input[type=number],select,textarea{background:var(--bg);border:1px solid var(--line2);border-radius:4px;padding:4px 6px;width:100%}
textarea{resize:vertical;min-height:58px;line-height:1.4}
input[type=range]{width:100%;accent-color:var(--mark);height:18px;margin:0}
input[type=color]{width:100%;height:24px;border:1px solid var(--line2);border-radius:4px;background:var(--bg);padding:1px 2px}
input[type=checkbox]{accent-color:var(--mark)}
#app{display:grid;grid-template-columns:230px 1fr 300px;grid-template-rows:46px 1fr;height:100%}
header{grid-column:1/4;display:flex;align-items:center;gap:18px;padding:0 14px;border-bottom:1px solid var(--line);background:var(--panel)}
header h1{font:300 22px/1 var(--serif);letter-spacing:.02em;margin:0;color:var(--ink)}
header h1 em{font-style:italic;color:var(--mark)}
header .sub{color:var(--dim);font-size:11px}
.seg{display:inline-flex;border:1px solid var(--line2);border-radius:5px;overflow:hidden}
.seg button{border:0;border-radius:0;background:transparent;padding:6px 10px;color:var(--dim)}
.seg button+button{border-left:1px solid var(--line2)}
.seg button.on{background:var(--panel2);color:var(--ink)}
.seg button.on.mark{background:var(--mark);color:var(--mark-ink)}
header .spacer{flex:1}
#time{font-variant-numeric:tabular-nums;color:var(--dim)}
aside{background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
#inspector{border-right:0;border-left:1px solid var(--line)}
.ph{display:flex;align-items:center;justify-content:space-between;padding:10px 12px 8px;color:var(--dim)}
.ph b{color:var(--ink);font-weight:500}
#layers{flex:1;overflow:auto;padding:0 8px 8px}
.layer{display:flex;align-items:center;gap:8px;padding:7px 8px;border:1px solid transparent;border-radius:5px;cursor:pointer;margin-bottom:3px}
.layer:hover{background:var(--panel2)}
.layer.sel{background:var(--panel2);border-color:var(--line2)}
.layer .name{flex:1;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.layer .role{font-size:10px;color:var(--faint)}
.layer .eye{opacity:.5;border:0;background:none;padding:2px 4px}
.layer .eye.off{opacity:.2}
.layer.dragover{border-top-color:var(--mark)}
#addrow{padding:8px;display:flex;gap:6px;border-top:1px solid var(--line)}
#addrow button{flex:1}
main{display:grid;grid-template-rows:1fr 150px;min-height:0;min-width:0}
#stagewrap{position:relative;display:flex;align-items:center;justify-content:center;padding:22px;min-height:0;background:radial-gradient(ellipse at 50% 40%,#22262d 0%,var(--bg) 70%)}
#stage{box-shadow:0 30px 60px -20px rgba(0,0,0,.7),0 0 0 1px var(--line);cursor:grab;touch-action:none}
#stage.dragging{cursor:grabbing}
#stagehint{position:absolute;left:22px;bottom:14px;color:var(--faint);font-size:11px}
#stagemeta{position:absolute;right:22px;bottom:14px;color:var(--faint);font-size:11px;font-variant-numeric:tabular-nums}
#timeline{border-top:1px solid var(--line);background:var(--panel);display:grid;grid-template-columns:150px 1fr;min-height:0}
#tlctl{display:flex;flex-direction:column;gap:6px;padding:10px;border-right:1px solid var(--line)}
#tlctl .row{display:flex;gap:6px}
#tlctl .row button{flex:1}
#tlctl label{display:flex;align-items:center;gap:6px;color:var(--dim);font-size:11px}
#tlctl input[type=number]{width:58px;padding:3px 5px}
#tracks{position:relative;min-width:0;overflow:hidden}
#trackcv{display:block;width:100%;height:100%;cursor:default}
/* inspector */
.tabs{display:flex;border-bottom:1px solid var(--line)}
.tabs button{flex:1;border:0;border-radius:0;background:transparent;padding:9px 0;color:var(--dim);font-size:11px;border-bottom:2px solid transparent}
.tabs button.on{color:var(--ink);border-bottom-color:var(--mark)}
#panel{flex:1;overflow:auto;padding:10px 12px 40px}
.sec{margin-bottom:14px}
.sec>h3{margin:0 0 6px;font-size:11px;font-weight:500;color:var(--dim);display:flex;justify-content:space-between;align-items:center}
.ctl{display:grid;grid-template-columns:86px 1fr 52px;align-items:center;gap:8px;margin-bottom:5px}
.ctl label{color:var(--dim);font-size:11px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.ctl .num{width:52px;padding:3px 4px;text-align:right;font-variant-numeric:tabular-nums}
.ctl.wide{grid-template-columns:86px 1fr}
.ctl.full{grid-template-columns:1fr}
.ctl.chk{grid-template-columns:86px auto}
.help{color:var(--faint);font-size:11px;margin:2px 0 8px;line-height:1.4}
.presets{display:grid;grid-template-columns:1fr 1fr;gap:4px;margin-bottom:8px}
.presets button{padding:6px 6px;font-size:11px;text-align:left;background:var(--bg)}
.presets button.on{border-color:var(--mark);color:var(--mark)}
.empty{color:var(--dim);padding:30px 10px;text-align:center;line-height:1.6}
.rowbtns{display:flex;gap:6px;margin-top:6px}
.rowbtns button{flex:1}
#progress{height:4px;background:var(--line);border-radius:2px;overflow:hidden;margin-top:8px;display:none}
#progress i{display:block;height:100%;width:0;background:var(--mark)}
.fontlist{max-height:130px;overflow:auto;border:1px solid var(--line2);border-radius:4px;background:var(--bg);margin-bottom:6px}
.fontlist div{padding:4px 8px;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fontlist div:hover{background:var(--panel2)}
.fontlist div.on{color:var(--mark)}
.fontlist small{color:var(--faint);float:right}
#toast{position:fixed;left:50%;bottom:170px;transform:translateX(-50%);background:var(--mark);color:var(--mark-ink);padding:6px 12px;border-radius:5px;font-weight:500;opacity:0;pointer-events:none;transition:opacity .2s}
#toast.show{opacity:1}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
@media (max-width:1000px){#app{grid-template-columns:190px 1fr 260px}}
</style>
</head>
<body>
<div id="app">
  <header>
    <h1>CHY<em>RON</em></h1>
    <span class="sub">text overlay animator</span>
    <div class="seg" id="modeSeg" title="Composition mode">
      <button data-mode="title">Title</button><button data-mode="subtitle">Subtitle</button>
    </div>
    <div class="seg" id="ratioSeg" title="Aspect ratio">
      <button data-ratio="9:16">9:16</button><button data-ratio="4:5">4:5</button><button data-ratio="1:1">1:1</button><button data-ratio="16:9">16:9</button>
    </div>
    <label style="display:flex;align-items:center;gap:6px;color:var(--dim)"><input type="checkbox" id="guides" checked> guides</label>
    <div class="spacer"></div>
    <span id="time">0.00 / 6.00 s</span>
    <button id="saveBtn" title="Download project as JSON">Save</button>
    <button id="loadBtn" title="Load a project JSON">Open</button>
    <input type="file" id="loadFile" accept="application/json" hidden>
  </header>

  <aside id="layerpanel">
    <div class="ph"><b>Layers</b><span id="layercount"></span></div>
    <div id="layers"></div>
    <div id="addrow"><button id="addTitle">+ Title</button><button id="addSub">+ Subtitle</button><button id="addImg" title="PNG, JPG, WebP or SVG">+ Image</button></div>
    <input type="file" id="imgFile" accept="image/*,.svg" multiple hidden>
  </aside>

  <main>
    <div id="stagewrap">
      <canvas id="stage"></canvas>
      <div id="stagehint">drag text to move · space plays · ⌫ deletes layer</div>
      <div id="stagemeta"></div>
    </div>
    <div id="timeline">
      <div id="tlctl">
        <div class="row"><button id="playBtn" class="primary">Play</button><button id="stopBtn" title="Back to start">⟲</button></div>
        <label>loop <input type="checkbox" id="loop" checked></label>
        <label>length <input type="number" id="duration" min="5" max="10" step="0.5"> s</label>
        <label>fps <select id="fps" style="width:auto"><option>24</option><option selected>30</option><option>60</option></select></label>
      </div>
      <div id="tracks"><canvas id="trackcv"></canvas></div>
    </div>
  </main>

  <aside id="inspector">
    <div class="tabs" id="tabs">
      <button data-tab="text" class="on">Text</button><button data-tab="motion">Motion</button><button data-tab="marker">Marker</button><button data-tab="space">3D</button><button data-tab="bg">Back</button><button data-tab="export">Export</button>
    </div>
    <div id="panel"></div>
  </aside>
</div>
<div id="toast"></div>

<script>
/* ---------- fonts ---------- */
const GOOGLE = ['Inter','Instrument Serif','Fraunces','Playfair Display','DM Sans','DM Serif Display','Space Grotesk','Space Mono','JetBrains Mono','IBM Plex Sans','IBM Plex Mono','Manrope','Sora','Syne','Unbounded','Bebas Neue','Anton','Oswald','Archivo Black','Archivo','Libre Caslon Text','Cormorant Garamond','EB Garamond','Lora','Newsreader','Bricolage Grotesque','Familjen Grotesk','Geist','Outfit','Plus Jakarta Sans','Poppins','Montserrat','Raleway','Work Sans','Rubik','Caveat','Kalam','Permanent Marker','Bangers','Abril Fatface','Bodoni Moda','Italiana','Cinzel','Josefin Sans','Figtree','Onest','Gloock','Young Serif','Pixelify Sans','Silkscreen','Major Mono Display','Instrument Sans','Schibsted Grotesk','Hanken Grotesk','Gothic A1','Noto Sans','Noto Serif','Roboto Mono','Chivo','Karla','Epilogue','Red Hat Display','Barlow Condensed','Big Shoulders Display','Righteous','Rozha One','Yeseva One','Comfortaa','Tenor Sans','Cormorant','Crimson Pro','Spectral','Literata','Source Serif 4','Zilla Slab','Roboto Slab','Arvo','Bitter','Merriweather'];
const FONTSHARE = ['Satoshi','General Sans','Clash Display','Clash Grotesk','Cabinet Grotesk','Switzer','Chillax','Zodiak','Sentient','Gambetta','Boska','Author','Erode','Ranade','Supreme','Melodrama','Tanker','Bespoke Serif','Bespoke Stencil','Panchang','Khand','Expose','Excon','Array','Alpino','Britney','Rowan','Stardom','Telma','Technor'];
const SYSTEM = ['system-ui','Georgia','Helvetica','Arial','Times New Roman','Courier New','Impact'];
const fontMeta = new Map(); // family -> {src, promise}
const localFonts = [];

function registerFont(family, src){ if(!fontMeta.has(family)) fontMeta.set(family,{src}); }
GOOGLE.forEach(f=>registerFont(f,'google')); FONTSHARE.forEach(f=>registerFont(f,'fontshare')); SYSTEM.forEach(f=>registerFont(f,'system'));

function injectCSS(css){ const s=document.createElement('style'); s.textContent=css; document.head.appendChild(s); }
async function loadGoogle(family){
  const enc = encodeURIComponent(family).replace(/%20/g,'+');
  const tries = [`${enc}:ital,wght@0,100..900;1,100..900`,`${enc}:wght@100..900`,`${enc}:wght@200..800`,`${enc}:wght@300..700`,`${enc}:ital,wght@0,400;0,700;1,400;1,700`,`${enc}:wght@400;700`,enc];
  for(const q of tries){
    try{ const r = await fetch(`https://fonts.googleapis.com/css2?family=${q}&display=swap`); if(r.ok){ injectCSS(await r.text()); return true; } }catch(e){}
  }
  return false;
}
function loadFontshare(family){
  const slug = family.toLowerCase().replace(/\s+/g,'-');
  const l=document.createElement('link'); l.rel='stylesheet';
  l.href=`https://api.fontshare.com/v2/css?f[]=${slug}@200,300,400,500,600,700,800,900,1,2&display=swap`;
  document.head.appendChild(l);
  return new Promise(res=>{ l.onload=()=>res(true); l.onerror=()=>res(false); setTimeout(()=>res(true),4000); });
}
async function ensureFont(family, weight=400, italic=false){
  const m = fontMeta.get(family); if(!m) return;
  if(!m.promise){
    if(m.src==='google') m.promise = loadGoogle(family);
    else if(m.src==='fontshare') m.promise = loadFontshare(family);
    else m.promise = Promise.resolve(true);
  }
  await m.promise;
  try{ await document.fonts.load(`${italic?'italic ':''}${weight} 32px "${family}"`,'Ag'); }catch(e){}
  needsDraw = true;
}
function fontStr(L, px){ return `${L.italic?'italic ':''}${L.weight} ${px}px "${L.family}", sans-serif`; }

/* ---------- state ---------- */
const RATIOS = {'9:16':[9,16],'4:5':[4,5],'1:1':[1,1],'16:9':[16,9]};
const EASES = {
  linear:p=>p, outCubic:p=>1-Math.pow(1-p,3), outQuint:p=>1-Math.pow(1-p,5), outExpo:p=>p>=1?1:1-Math.pow(2,-10*p),
  inOutCubic:p=>p<.5?4*p*p*p:1-Math.pow(-2*p+2,3)/2, inOutQuint:p=>p<.5?16*p**5:1-Math.pow(-2*p+2,5)/2,
  outBack:p=>{const c=1.70158;return 1+(c+1)*Math.pow(p-1,3)+c*Math.pow(p-1,2)}, outElastic:p=>p===0?0:p===1?1:Math.pow(2,-10*p)*Math.sin((p*10-.75)*(2*Math.PI/3))+1,
  inCubic:p=>p*p*p, inQuint:p=>p**5, inBack:p=>{const c=1.70158;return (c+1)*p*p*p-c*p*p}
};
const IN_PRESETS = {
  'Fade':{inOp:0,inX:0,inY:0,inScale:1,inBlur:0,inRot:0,inFlip:0,inSpread:0,stagger:0,unit:'char',ease:'outCubic',inDur:.8,inKind:'ease'},
  'Rise by character':{inOp:0,inX:0,inY:40,inScale:1,inBlur:0,inRot:0,inFlip:0,inSpread:0,stagger:.03,unit:'char',ease:'outQuint',inDur:.7,inKind:'ease'},
  'Drop in':{inOp:0,inX:0,inY:-50,inScale:1,inBlur:0,inRot:0,inFlip:0,inSpread:0,stagger:.025,unit:'char',ease:'outBack',inDur:.6,inKind:'ease'},
  'Words fade up':{inOp:0,inX:0,inY:24,inScale:1,inBlur:0,inRot:0,inFlip:0,inSpread:0,stagger:.12,unit:'word',ease:'outQuint',inDur:.6,inKind:'ease'},
  'Lines rise':{inOp:0,inX:0,inY:60,inScale:1,inBlur:6,inRot:0,inFlip:0,inSpread:0,stagger:.18,unit:'line',ease:'outExpo',inDur:.9,inKind:'ease'},
  'Slide from left':{inOp:0,inX:-60,inY:0,inScale:1,inBlur:0,inRot:0,inFlip:0,inSpread:0,stagger:.06,unit:'word',ease:'outExpo',inDur:.7,inKind:'ease'},
  'Scale pop':{inOp:0,inX:0,inY:0,inScale:.5,inBlur:0,inRot:0,inFlip:0,inSpread:0,stagger:.02,unit:'char',ease:'outBack',inDur:.5,inKind:'ease'},
  'Blur reveal':{inOp:0,inX:0,inY:0,inScale:1.05,inBlur:24,inRot:0,inFlip:0,inSpread:0,stagger:.03,unit:'char',ease:'outCubic',inDur:.9,inKind:'ease'},
  'Typewriter':{inOp:0,inX:0,inY:0,inScale:1,inBlur:0,inRot:0,inFlip:0,inSpread:0,stagger:.05,unit:'char',ease:'linear',inDur:.01,inKind:'step'},
  'Flip up':{inOp:0,inX:0,inY:12,inScale:1,inBlur:0,inRot:0,inFlip:90,inSpread:0,stagger:.04,unit:'char',ease:'outCubic',inDur:.6,inKind:'ease'},
  'Spin in':{inOp:0,inX:0,inY:0,inScale:.7,inBlur:0,inRot:-30,inFlip:0,inSpread:0,stagger:.03,unit:'char',ease:'outQuint',inDur:.7,inKind:'ease'},
  'Opacity ripple':{inOp:0,inX:0,inY:0,inScale:1,inBlur:0,inRot:0,inFlip:0,inSpread:0,stagger:.06,unit:'char',ease:'outCubic',inDur:.25,inKind:'ease'},
  'Expand tracking':{inOp:0,inX:0,inY:0,inScale:1,inBlur:4,inRot:0,inFlip:0,inSpread:-18,stagger:0,unit:'char',ease:'outExpo',inDur:1.1,inKind:'ease'},
  'Elastic drop':{inOp:0,inX:0,inY:-80,inScale:1,inBlur:0,inRot:0,inFlip:0,inSpread:0,stagger:.03,unit:'char',ease:'outElastic',inDur:1.2,inKind:'ease'},
};
const OUT_PRESETS = {
  'Fade':{outOp:0,outX:0,outY:0,outScale:1,outBlur:0,outRot:0,outFlip:0,outSpread:0,outStagger:0,outEase:'inOutCubic',outDur:.6,outKind:'ease',outReverse:false},
  'Sink':{outOp:0,outX:0,outY:30,outScale:1,outBlur:0,outRot:0,outFlip:0,outSpread:0,outStagger:.02,outEase:'inCubic',outDur:.5,outKind:'ease',outReverse:false},
  'Lift away':{outOp:0,outX:0,outY:-40,outScale:1,outBlur:6,outRot:0,outFlip:0,outSpread:0,outStagger:.02,outEase:'inQuint',outDur:.6,outKind:'ease',outReverse:false},
  'Slide right':{outOp:0,outX:60,outY:0,outScale:1,outBlur:0,outRot:0,outFlip:0,outSpread:0,outStagger:.05,outEase:'inCubic',outDur:.6,outKind:'ease',outReverse:false},
  'Shrink':{outOp:0,outX:0,outY:0,outScale:.6,outBlur:0,outRot:0,outFlip:0,outSpread:0,outStagger:.02,outEase:'inBack',outDur:.5,outKind:'ease',outReverse:true},
  'Blur out':{outOp:0,outX:0,outY:0,outScale:1.05,outBlur:24,outRot:0,outFlip:0,outSpread:0,outStagger:.02,outEase:'inCubic',outDur:.8,outKind:'ease',outReverse:false},
  'Untype':{outOp:0,outX:0,outY:0,outScale:1,outBlur:0,outRot:0,outFlip:0,outSpread:0,outStagger:.04,outEase:'linear',outDur:.01,outKind:'step',outReverse:true},
  'Flip down':{outOp:0,outX:0,outY:-12,outScale:1,outBlur:0,outRot:0,outFlip:90,outSpread:0,outStagger:.03,outEase:'inCubic',outDur:.5,outKind:'ease',outReverse:false},
  'Collapse tracking':{outOp:0,outX:0,outY:0,outScale:1,outBlur:6,outRot:0,outFlip:0,outSpread:-14,outStagger:0,outEase:'inQuint',outDur:.9,outKind:'ease',outReverse:false},
  'Hard cut':{outOp:0,outX:0,outY:0,outScale:1,outBlur:0,outRot:0,outFlip:0,outSpread:0,outStagger:0,outEase:'linear',outDur:.01,outKind:'step',outReverse:false},
};
const BLENDS=[['source-over','normal'],['multiply','multiply'],['screen','screen'],['overlay','overlay'],['darken','darken'],['lighten','lighten'],['color-dodge','color dodge'],['color-burn','color burn'],['hard-light','hard light'],['soft-light','soft light'],['difference','difference'],['exclusion','exclusion'],['hue','hue'],['saturation','saturation'],['color','color'],['luminosity','luminosity']];
const ROLE_DEFAULTS = {
  title:{ family:'Bricolage Grotesque', weight:700, size:96, lineHeight:1.02, tracking:-25, align:'center', x:50, y:46, wrap:82, plate:false, color:'#f4f2ea', anim:'Rise by character', out:'Blur out' },
  subtitle:{ family:'Inter', weight:500, size:38, lineHeight:1.25, tracking:0, align:'center', x:50, y:86, wrap:80, plate:true, color:'#ffffff', anim:'Words fade up', out:'Fade' }
};

let uid = 1;
function newLayer(role, text){
  const d = ROLE_DEFAULTS[role];
  const L = {
    id: uid++, role, text: text || (role==='title' ? 'Say the quiet\npart loud.' : 'A subtitle that stays out of the way.'),
    hidden:false, family:d.family, weight:d.weight, italic:false, size:d.size, lineHeight:d.lineHeight, tracking:d.tracking, align:d.align,
    color:d.color, opacity:1, x:d.x, y:d.y, z:0, wrap:d.wrap, blend:'source-over', kind:'text',
    rx:0, ry:0, rz:0, persp:1400, sx:1, sy:1,
    start:0.3, end:5.2,
    anim:Object.assign({inPreset:d.anim, outPreset:d.out, idle:'none', idleAmp:6, idleSpeed:.6}, IN_PRESETS[d.anim], OUT_PRESETS[d.out]),
    marker:{type:'none', color:'#f2d94e', opacity:.9, thickness:1, roughness:.5, pad:.25, delay:.15, dur:.7, ease:'inOutCubic', behind:true},
    plate:{on:d.plate, color:'#000000', opacity:.55, pad:.5, radius:.25, wipe:true},
    shadow:{on:false, color:'#000000', opacity:.5, blur:12, x:0, y:6},
    stroke:{on:false, color:'#000000', width:0}
  };
  ensureFont(L.family, L.weight, L.italic);
  return L;
}
function imageDefaults(L){
  L.crop=L.crop||{x:0,y:0,w:100,h:100}; L.skx=L.skx||0; L.sky=L.sky||0;
  L.fx=Object.assign({flipH:false,flipV:false,blur:0,pixel:0,resolve:false,gray:0,bright:100,contrast:100,sat:100,hue:0,invert:0,sepia:0,mask:'none',radius:20,feather:0},L.fx||{});
}
const procCache=new Map();

/* stage drag */

/* ---------- tracks ---------- */

/* ---------- inspector ---------- */

async function exportVideo(){

  const [W,H]=compSize(state.exp.short); const c=document.createElement('canvas'); c.width=W; c.height=H; const cx=c.getContext('2d');
  const fps=state.comp.fps, dur=state.comp.duration, n=Math.round(fps*dur);

  let rec; try{ rec=new MediaRecorder(stream2,{mimeType:state.exp.format,videoBitsPerSecond:state.exp.mbps*1e6}); }catch(e){ toast('Could not start recorder: '+e.message); exporting=false; return; }

    if(bar) bar.style.width=(i/n*100).toFixed(1)+'%'; if(st) st.textContent=`Rendering ${i}/${n} · ${t.toFixed(2)}s`;
    const target=t0+(i+1)*1000/fps; await sleep(Math.max(1,target-performance.now()));

/* ---------- header / misc ---------- */
function syncRatioUI(){ document.querySelectorAll('#ratioSeg button').forEach(b=>b.classList.toggle('on',b.dataset.ratio===state.comp.ratio)); document.querySelectorAll('#modeSeg button').forEach(b=>{ b.classList.toggle('on',b.dataset.mode===state.comp.mode); b.classList.toggle('mark',b.dataset.mode===state.comp.mode); }); document.getElementById('duration').value=state.comp.duration; document.getElementById('fps').value=state.comp.fps; }
document.getElementById('ratioSeg').onclick=e=>{ const b=e.target.closest('button'); if(!b) return; state.comp.ratio=b.dataset.ratio; syncRatioUI(); fitStage(); if(tab==='export') buildPanel(); };
document.getElementById('modeSeg').onclick=e=>{ const b=e.target.closest('button'); if(!b) return; state.comp.mode=b.dataset.mode; syncRatioUI(); needsDraw=true; toast(state.comp.mode==='title'?'Title composition — new layers land centre-frame':'Subtitle composition — new layers land in the caption zone'); };
document.getElementById('guides').onchange=e=>{ state.comp.guides=e.target.checked; needsDraw=true; };
let toastT; function toast(msg){ const t=document.getElementById('toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(toastT); toastT=setTimeout(()=>t.classList.remove('show'),2200); }
window.addEventListener('keydown',e=>{ const tag=document.activeElement.tagName; if(tag==='INPUT'||tag==='TEXTAREA'||tag==='SELECT') return; if(e.code==='Space'){ e.preventDefault(); togglePlay(); } else if(e.key==='Backspace'||e.key==='Delete'){ deleteLayer(); } else if(e.key==='ArrowLeft'||e.key==='ArrowRight'){ if(e.shiftKey){ const L=curLayer(); if(L){ L.x+= e.key==='ArrowLeft'?-.5:.5; syncInputs(); needsDraw=true; } } else { state.t=clamp(state.t+(e.key==='ArrowLeft'?-1:1)/state.comp.fps,0,state.comp.duration); needsDraw=true; } } else if(e.key==='ArrowUp'||e.key==='ArrowDown'){ const L=curLayer(); if(L){ e.preventDefault(); L.y+= e.key==='ArrowUp'?-.5:.5; syncInputs(); needsDraw=true; } } else if(e.key==='d'&&(e.metaKey||e.ctrlKey)){ e.preventDefault(); duplicateLayer(); } });
window.addEventListener('resize',fitStage);
document.fonts.addEventListener('loadingdone',()=>{ needsDraw=true; });
document.addEventListener('visibilitychange',()=>{ last=performance.now(); });

/* ---------- boot ---------- */
(function boot(){
  const a=newLayer('title','Say the quiet\npart loud.'); a.start=.2; a.end=5.2; a.marker.type='highlight'; a.marker.delay=.5; a.marker.dur=.8;
  const b=newLayer('subtitle','A caption that knows its place.'); b.start=1.1; b.end=5.4; b.size=32;
  state.layers.push(a,b); state.sel=a.id; state.playing=true;
  syncRatioUI(); fitStage(); renderLayers(); buildPanel(); updatePlayBtn(); ensureFont('JetBrains Mono',400,false); requestAnimationFrame(tick);
})();
</script>
</body>
</html>
